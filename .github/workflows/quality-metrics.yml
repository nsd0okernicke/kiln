name: quality-metrics

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deterministic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m tools.quality_metrics --tier deterministic --observe
      # Reuses the .coverage data the step above already wrote, so this costs no extra
      # test run. One matrix leg only: the number is the same on every leg, and a floor
      # breach should report once rather than four times.
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        env:
          COVERAGE_FLOOR: "95"
        run: |
          total=$(python -m coverage report --format=total)
          {
            echo "### Coverage gate"
            echo ""
            echo "Combined statement + branch coverage: **${total}%** (floor **${COVERAGE_FLOOR}%**)"
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --fail-under="$COVERAGE_FLOOR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
          retention-days: 30

  hard-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -p no:cacheprovider
      - run: python -m ruff check src tests tools
      - run: python -m compileall -q src
      - run: pyright

  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python -m pytest tests/acceptance --junitxml=reports/acceptance/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-test-reports-${{ matrix.os }}
          path: reports/acceptance/
          retention-days: 30

  mutation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: pure
          - name: db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m tools.run_mutation ${{ matrix.name }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.name }}
          path: reports/mutation/
          retention-days: 30
