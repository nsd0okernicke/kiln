# Tooling configuration for Kiln's OWN framework code (kiln/framework/**).
#
# This now also carries editable-install metadata while the existing scripts remain
# compatibility entry points. Tool configuration stays project-local, per
# constitution/engineering.md's "prefer project-local cache/configuration paths".
#
# Note: the constitution under kiln/project/ is scaffolding Kiln writes into projects
# it orchestrates. The thresholds below apply that same discipline to Kiln itself.

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln-swarm"
version = "0.1.0"
description = "A local, role-based agent orchestration framework"
readme = "kiln/README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.6",
    "ruff>=0.9",
    "radon>=6.0",
    "pyright>=1.1.390",
    "cosmic-ray>=8.4",
]

[project.scripts]
kiln = "launcher.cli:main"
kiln-scheduler = "scheduler.role_scheduler:main"
kiln-dashboard = "scheduler.dashboard:main"
kiln-cockpit = "cockpit.server:main"

[tool.setuptools]
package-dir = {"" = "kiln/framework"}

[tool.setuptools.packages.find]
where = ["kiln/framework"]
include = ["launcher*", "scheduler*", "cockpit*", "proxy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# kiln/framework is not an importable package path from the repo root (its sibling
# `mcp-server` has a hyphen), so put it on sys.path instead of adding __init__.py
# files that would change how the scaffolder copies these trees.
pythonpath = ["kiln/framework"]
addopts = "-q --strict-markers"
markers = [
    "integration: exercises real SQLite + real git (slower; no live LLM)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".worktrees", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# En/em dashes are used deliberately throughout this project's prose and log messages.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mutmut]
paths_to_mutate = "kiln/framework/scheduler/"
tests_dir = "tests/"

[tool.coverage.run]
branch = true
source = ["kiln/framework"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.json]
show_contexts = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = [
    "kiln/framework/scheduler/models.py",
    "kiln/framework/scheduler/policies.py",
    "kiln/framework/scheduler/ports.py",
    "kiln/framework/scheduler/infrastructure.py",
    "kiln/framework/scheduler/application.py",
    "kiln/framework/scheduler/db.py",
    "kiln/framework/scheduler/routing.py",
    "kiln/framework/scheduler/handoff.py",
    "kiln/framework/scheduler/status_contract.py",
    "kiln/framework/scheduler/worker_prompt.py",
    "kiln/framework/cockpit/state.py",
]
extraPaths = ["kiln/framework"]
reportMissingTypeStubs = false
