# Tooling configuration for Kiln's own Python code (`src/kiln/**`).
#
# This now also carries editable-install metadata while the existing scripts remain
# compatibility entry points. Tool configuration stays project-local, per
# constitution/engineering.md's "prefer project-local cache/configuration paths".
#
# Note: resources/project is scaffolding Kiln writes to each project's kiln/project/
# it orchestrates. The thresholds below apply that same discipline to Kiln itself.

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln-swarm"
version = "0.1.0"
description = "A local, role-based agent orchestration framework"
readme = "README.md"
license = { text = "UNLICENSED" }
requires-python = ">=3.11"
dependencies = ["pypdf>=5.0"]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.6",
    "ruff>=0.9",
    "radon>=6.0",
    "pyright>=1.1.390",
    "cosmic-ray>=8.4",
]

[project.scripts]
kiln = "kiln.launcher.infrastructure.cli:main"
kiln-scheduler = "kiln.scheduler.infrastructure.cli.role_scheduler:main"
kiln-dashboard = "kiln.scheduler.infrastructure.cli.dashboard:main"
kiln-cockpit = "kiln.cockpit.infrastructure.http.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kiln*"]

[tool.setuptools.package-data]
kiln = [
    "cockpit/infrastructure/http/static/*.html",
    "mcp_server/*.txt",
    "resources/*.json",
    "resources/templates/*.md",
    "resources/tools/*.py",
    "resources/claude/*.json",
    "resources/project/*.md",
    "resources/project/*.json",
    "resources/project/constitution/*.md",
    "resources/project/roles/*.md",
    "resources/project/skills/*/*.md",
    "resources/project/skills/*/references/*.md",
    "resources/project/skills/*/scripts/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/property", "tests/integration"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: exercises multiple components or real infrastructure adapters",
    "acceptance: exercises a complete Kiln process topology",
    "live: invokes external agent services or CLIs",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".worktrees", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# En/em dashes are used deliberately throughout this project's prose and log messages.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.bandit]
skips = [
    "B101",  # assert — precondition guards, not validation
    "B105",  # hardcoded password string — false positive for string literals
    "B110",  # try/except/pass — intentional for non-fatal platform ops
    "B404",  # subprocess import — orchestration tool, intentional
    "B602",  # shell=True — intentional for user-configured verify commands
    "B603",  # subprocess without shell=True — shell=False is safer
    "B607",  # partial executable path — git/taskkill on PATH by design
    "B608",  # SQL f-string — values are module-controlled constants, never user input
]
targets = ["src/kiln"]

[tool.vulture]
# 80%+ confidence = almost certainly dead code.
# Lower-confidence items are mostly HTTP handler methods and HTML parser callbacks
# invoked by base-class reflection — genuine but harmless false positives.
min_confidence = 80
paths = ["src/kiln"]

[tool.mutmut]
paths_to_mutate = "src/kiln/scheduler/"
tests_dir = "tests/"

[tool.coverage.run]
branch = true
source = ["src/kiln"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.json]
show_contexts = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src/kiln"]
exclude = ["**/__pycache__", "**/.venv"]
extraPaths = ["src"]
reportMissingTypeStubs = false
reportTypedDictNotRequiredAccess = false
reportAttributeAccessIssue = false
reportArgumentType = false
reportMissingImports = false
reportReturnType = false
