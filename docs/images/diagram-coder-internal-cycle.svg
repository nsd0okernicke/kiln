<svg width="100%" viewBox="0 0 1090 730" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Wrapper mode: the coder wrapper's internal cycle</title>
<desc>Wrapper mode. A persistent LLM session follows the prose loop in loop-auto-claude.md: run /kiln-receive, which blocks on wait_for_message() through the kiln-channel MCP server, persists tmp/handoff-in.md, merges the sender's commit and logs RECEIVED; call mark_processing on the message id; delegate with the Agent tool to the coder-worker subagent, blocking on the result; ask whether the worker reported done — if not, invoke it once more with the failure as feedback, and a second failure hands off a blocker report instead of normal work; run /kiln-handoff, which logs SENT, squashes, inserts the message and reads it back to verify; call mark_processed; then immediately call /kiln-receive again in the same turn. On the left, the disposable coder-worker subagent receives the handoff text with worktree tools only, loops through tdd-red, tdd-green and tdd-refactor until all tests pass, and returns only a final report.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .name { font-size: 14px; font-weight: 500; }
    .sub  { font-size: 11.5px; font-weight: 400; }
    .edge { font-size: 12px; fill: #52514e; }
    .grp  { font-size: 12.5px; font-weight: 500; fill: #52514e; }
    .note { font-size: 10.5px; fill: #6b6a66; }
    .box  { stroke-width: 0.5; }
    .conn { fill: none; stroke: #898781; stroke-width: 1.5; }
    .cluster { fill: none; stroke: #898781; stroke-width: 0.5; stroke-dasharray: 4 4; opacity: 0.6; }
  </style>
</defs>

<rect x="0" y="0" width="1090" height="730" fill="#fcfcfb"/>

<!-- ================= WORKER SUBAGENT ================= -->
<rect class="cluster" x="40" y="200" width="460" height="460" rx="16"/>
<text class="grp" x="270" y="224" text-anchor="middle">coder-worker — a disposable subagent, fresh context each cycle</text>

<g>
  <rect class="box" x="90" y="246" width="360" height="48" rx="8" fill="#faece7" stroke="#993c1d"/>
  <text class="sub" x="270" y="266" text-anchor="middle" fill="#712b13">.claude/agents/coder-worker.md</text>
  <text class="sub" x="270" y="282" text-anchor="middle" fill="#993c1d">worktree tools only — no Agent tool, no MCP messaging</text>
</g>

<rect class="cluster" x="90" y="314" width="360" height="232" rx="12"/>
<text class="grp" x="270" y="336" text-anchor="middle">loop until all tests pass</text>

<g>
  <rect class="box" x="125" y="352" width="290" height="48" rx="8" fill="#faece7" stroke="#993c1d"/>
  <text class="name" x="270" y="372" text-anchor="middle" fill="#712b13">/tdd-red</text>
  <text class="sub"  x="270" y="389" text-anchor="middle" fill="#993c1d">one minimal failing test</text>
</g>
<line class="conn" x1="270" y1="400" x2="270" y2="414" marker-end="url(#arrow)"/>

<g>
  <rect class="box" x="125" y="416" width="290" height="48" rx="8" fill="#faece7" stroke="#993c1d"/>
  <text class="name" x="270" y="436" text-anchor="middle" fill="#712b13">/tdd-green</text>
  <text class="sub"  x="270" y="453" text-anchor="middle" fill="#993c1d">just enough code to pass it</text>
</g>
<line class="conn" x1="270" y1="464" x2="270" y2="478" marker-end="url(#arrow)"/>

<g>
  <rect class="box" x="125" y="480" width="290" height="48" rx="8" fill="#faece7" stroke="#993c1d"/>
  <text class="name" x="270" y="500" text-anchor="middle" fill="#712b13">/tdd-refactor</text>
  <text class="sub"  x="270" y="517" text-anchor="middle" fill="#993c1d">clean up while it stays green</text>
</g>

<path class="conn" d="M125 510 H106 V376 H123" marker-end="url(#arrow)"/>

<g>
  <rect class="box" x="90" y="568" width="360" height="52" rx="8" fill="#faece7" stroke="#993c1d"/>
  <text class="sub" x="270" y="588" text-anchor="middle" fill="#712b13">final report — what it built, what it verified, files touched</text>
  <text class="sub" x="270" y="606" text-anchor="middle" fill="#993c1d">only the report returns; its transcript never does</text>
</g>

<!-- ================= WRAPPER SESSION ================= -->
<rect class="cluster" x="600" y="60" width="460" height="620" rx="16"/>
<text class="grp" x="830" y="84" text-anchor="middle">coder wrapper — one persistent LLM session, following prose</text>

<g>
  <rect class="box" x="670" y="104" width="300" height="68" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
  <text class="name" x="820" y="126" text-anchor="middle" fill="#0c447c">/kiln-receive</text>
  <text class="sub"  x="820" y="146" text-anchor="middle" fill="#185fa5">wait_for_message() blocks on kiln-channel</text>
  <text class="sub"  x="820" y="162" text-anchor="middle" fill="#185fa5">persist tmp/handoff-in.md · merge · log [RECEIVED]</text>
</g>
<line class="conn" x1="820" y1="172" x2="820" y2="192" marker-end="url(#arrow)"/>

<g>
  <rect class="box" x="670" y="194" width="300" height="52" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
  <text class="name" x="820" y="214" text-anchor="middle" fill="#0c447c">mark_processing(id)</text>
  <text class="sub"  x="820" y="233" text-anchor="middle" fill="#185fa5">delivered → processing</text>
</g>
<line class="conn" x1="820" y1="246" x2="820" y2="266" marker-end="url(#arrow)"/>

<g>
  <rect class="box" x="670" y="268" width="300" height="68" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
  <text class="name" x="820" y="290" text-anchor="middle" fill="#0c447c">delegate with the Agent tool</text>
  <text class="sub"  x="820" y="310" text-anchor="middle" fill="#185fa5">subagent_type: coder-worker · blocking</text>
  <text class="sub"  x="820" y="326" text-anchor="middle" fill="#185fa5">the wrapper implements nothing itself</text>
</g>
<line class="conn" x1="820" y1="336" x2="820" y2="354" marker-end="url(#arrow)"/>

<g>
  <path d="M820 356 L930 396 L820 436 L710 396 Z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
  <text class="sub" x="820" y="400" text-anchor="middle" fill="#2b2a28">worker reported done?</text>
</g>

<path class="conn" d="M932 396 H1005 V296 H973" marker-end="url(#arrow)"/>
<text class="edge" x="945" y="352" text-anchor="middle">no — retry once;</text>
<text class="edge" x="945" y="366" text-anchor="middle">a second failure</text>
<text class="edge" x="945" y="380" text-anchor="middle">hands off a blocker</text>

<line class="conn" x1="820" y1="436" x2="820" y2="456" marker-end="url(#arrow)"/>
<text class="edge" x="842" y="452" text-anchor="middle">yes</text>

<g>
  <rect class="box" x="670" y="458" width="300" height="68" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
  <text class="name" x="820" y="480" text-anchor="middle" fill="#0c447c">/kiln-handoff</text>
  <text class="sub"  x="820" y="500" text-anchor="middle" fill="#185fa5">log [SENT] · squash · INSERT via kiln-db</text>
  <text class="sub"  x="820" y="516" text-anchor="middle" fill="#185fa5">read the row back, retry the INSERT if missing</text>
</g>
<line class="conn" x1="820" y1="526" x2="820" y2="546" marker-end="url(#arrow)"/>

<g>
  <rect class="box" x="670" y="548" width="300" height="52" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
  <text class="name" x="820" y="568" text-anchor="middle" fill="#0c447c">mark_processed(id)</text>
  <text class="sub"  x="820" y="587" text-anchor="middle" fill="#185fa5">processing → processed</text>
</g>

<path class="conn" d="M820 600 V630 H1030 V132 H973" marker-end="url(#arrow)"/>
<text class="edge" x="866" y="617" text-anchor="middle">step 7 — /kiln-receive again, in the same turn</text>

<text class="note" x="830" y="662" text-anchor="middle">prose, not a state machine — the model decides when the turn is over</text>

<!-- ================= cross edges ================= -->
<line class="conn" x1="668" y1="302" x2="455" y2="282" marker-end="url(#arrow)"/>
<text class="edge" x="560" y="282" text-anchor="middle">delegate</text>

<path class="conn" d="M452 594 C 545 594, 560 500, 708 398" marker-end="url(#arrow)"/>
<text class="edge" x="559" y="522" text-anchor="middle">report back</text>

<text class="note" x="545" y="706" text-anchor="middle">Wrapper mode. Every shipped profile now runs its auto roles on the scheduler instead — see diagram-scheduler-cycle.svg — and keeps this mode for the human-facing manual role.</text>
</svg>
