  <text class="sub"  x="850" y="466" text-anchor="middle" fill="#0f6e56">scheduler (Python) +</text>
  <text class="sub"  x="850" y="482" text-anchor="middle" fill="#0f6e56">worker (LLM) per cycle</text>
