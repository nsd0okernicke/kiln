<svg width="100%" viewBox="0 0 1040 630" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Default profile topology, agentic coding cycle</title>
<desc>The full profile. On the left, human intake and review: a manual human-in-the-loop pane running in the main directory, with an inbox strip beneath it that waits for messages, merges the sender's commit and delivers to the pane above. The human-in-the-loop sends a new request to the Specifier. On the right, the autonomous cycle runs specifier, coder, refactorer and architect on the deterministic Python scheduler, each in its own worktree. The specifier owns the acceptance criteria and hands off features files; the coder owns the implementation; the refactorer owns behavior-preserving cleanup; the architect owns boundaries and runs final verification. Specifier hands off to Coder, Coder to Refactorer, Refactorer to Architect, and Architect back to Specifier. The Specifier returns a completion to the inbox, and any role can escalate to the inbox. Below the intake group, monitoring and control: the Dashboard gives a swarm-wide view of the run and the Cockpit web UI also drives it.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#a8422a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .name { font-size: 14px; font-weight: 500; }
    .sub  { font-size: 11.5px; font-weight: 400; }
    .edge { font-size: 12px; fill: #52514e; }
    .grp  { font-size: 12px; fill: #52514e; }
    .note { font-size: 10.5px; fill: #6b6a66; }
    .box  { stroke-width: 0.5; }
    .conn { fill: none; stroke: #898781; stroke-width: 1.5; }
    .dash { fill: none; stroke: #898781; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .cluster { fill: none; stroke: #898781; stroke-width: 0.5; stroke-dasharray: 4 4; opacity: 0.6; }
  </style>
</defs>

<rect x="0" y="0" width="1040" height="630" fill="#fcfcfb"/>

<!-- ===== groups ===== -->
<rect class="cluster" x="26" y="118" width="238" height="280" rx="16"/>
<text class="grp" x="145" y="138" text-anchor="middle">Human intake &amp; review</text>

<rect class="cluster" x="26" y="430" width="238" height="140" rx="16"/>
<text class="grp" x="145" y="450" text-anchor="middle">Monitoring &amp; control</text>

<rect class="cluster" x="340" y="100" width="670" height="490" rx="16"/>
<text class="grp" x="675" y="122" text-anchor="middle">Autonomous cycle — each role runs a Python scheduler + LLM worker</text>

<!-- ===== human-in-the-loop ===== -->
<g>
  <rect class="box" x="40" y="152" width="210" height="98" rx="8" fill="#eeedfe" stroke="#534ab7"/>
  <text class="name" x="145" y="180" text-anchor="middle" fill="#3c3489">Human-in-the-Loop</text>
  <text class="sub"  x="145" y="202" text-anchor="middle" fill="#534ab7">manual · @current</text>
  <text class="sub"  x="145" y="220" text-anchor="middle" fill="#534ab7">gathers &amp; confirms</text>
  <text class="sub"  x="145" y="236" text-anchor="middle" fill="#534ab7">the request</text>
</g>

<!-- ===== inbox ===== -->
<g>
  <rect class="box" x="40" y="296" width="210" height="84" rx="8" fill="#f6f5ff" stroke="#7871c4"/>
  <text class="name" x="145" y="320" text-anchor="middle" fill="#3c3489">Inbox</text>
  <text class="sub"  x="145" y="340" text-anchor="middle" fill="#6058b2">kiln inbox — waits, merges,</text>
  <text class="sub"  x="145" y="356" text-anchor="middle" fill="#6058b2">delivers to the pane above</text>
</g>

<line class="conn" x1="145" y1="294" x2="145" y2="253" marker-end="url(#arrow)"/>
<text class="edge" x="205" y="277" text-anchor="middle">surfaces it</text>

<!-- ===== dashboard ===== -->
<g>
  <rect class="box" x="40" y="466" width="210" height="88" rx="8" fill="#f2f2f0" stroke="#898781"/>
  <text class="name" x="145" y="494" text-anchor="middle" fill="#3c3b38">Dashboard &amp; Cockpit</text>
  <text class="sub"  x="145" y="516" text-anchor="middle" fill="#5a5854">dashboard: swarm-wide view</text>
  <text class="sub"  x="145" y="532" text-anchor="middle" fill="#5a5854">cockpit: web UI, drives the run</text>
</g>

<!-- ===== cycle roles ===== -->
<g>
  <rect class="box" x="380" y="160" width="240" height="124" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
  <text class="name" x="500" y="192" text-anchor="middle" fill="#0c447c">Specifier</text>
  <rect class="box" x="564" y="168" width="38" height="18" rx="4" fill="#185fa5" stroke="none"/>
  <text class="sub" x="583" y="181" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="10px">PY</text>
  <rect class="box" x="564" y="190" width="38" height="18" rx="4" fill="#993c1d" stroke="none"/>
  <text class="sub" x="583" y="203" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="10px">LLM</text>
  <text class="sub"  x="500" y="216" text-anchor="middle" fill="#185fa5">auto · own worktree</text>
  <text class="sub"  x="500" y="235" text-anchor="middle" fill="#185fa5">owns the acceptance criteria</text>
  <text class="sub"  x="500" y="254" text-anchor="middle" fill="#185fa5">runs /gherkin-spec-workflow</text>
  <text class="sub"  x="500" y="273" text-anchor="middle" fill="#185fa5">hands off features/*.feature</text>
</g>

<g>
  <rect class="box" x="730" y="160" width="240" height="124" rx="8" fill="#faece7" stroke="#993c1d"/>
  <text class="name" x="850" y="192" text-anchor="middle" fill="#712b13">Coder</text>
  <rect class="box" x="914" y="168" width="38" height="18" rx="4" fill="#185fa5" stroke="none"/>
  <text class="sub" x="933" y="181" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="10px">PY</text>
  <rect class="box" x="914" y="190" width="38" height="18" rx="4" fill="#993c1d" stroke="none"/>
  <text class="sub" x="933" y="203" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="10px">LLM</text>
  <text class="sub"  x="850" y="216" text-anchor="middle" fill="#993c1d">auto · own worktree</text>
  <text class="sub"  x="850" y="235" text-anchor="middle" fill="#993c1d">owns the implementation</text>
  <text class="sub"  x="850" y="254" text-anchor="middle" fill="#993c1d">runs TDD red → green → refactor</text>
  <text class="sub"  x="850" y="273" text-anchor="middle" fill="#993c1d">hands off code + step definitions</text>
</g>

<g>
  <rect class="box" x="730" y="390" width="240" height="124" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
  <text class="name" x="850" y="422" text-anchor="middle" fill="#085041">Refactorer</text>
  <rect class="box" x="914" y="398" width="38" height="18" rx="4" fill="#185fa5" stroke="none"/>
  <text class="sub" x="933" y="411" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="10px">PY</text>
  <rect class="box" x="914" y="420" width="38" height="18" rx="4" fill="#993c1d" stroke="none"/>
  <text class="sub" x="933" y="433" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="10px">LLM</text>
  <text class="sub"  x="850" y="446" text-anchor="middle" fill="#0f6e56">auto · own worktree</text>
  <text class="sub"  x="850" y="465" text-anchor="middle" fill="#0f6e56">owns structure-preserving cleanup</text>
  <text class="sub"  x="850" y="484" text-anchor="middle" fill="#0f6e56">runs coverage → CRAP → DRY → sites</text>
  <text class="sub"  x="850" y="503" text-anchor="middle" fill="#0f6e56">hands off cleaner code + properties</text>
</g>

<g>
  <rect class="box" x="380" y="390" width="240" height="124" rx="8" fill="#faeeda" stroke="#854f0b"/>
  <text class="name" x="500" y="422" text-anchor="middle" fill="#633806">Architect</text>
  <rect class="box" x="564" y="398" width="38" height="18" rx="4" fill="#185fa5" stroke="none"/>
  <text class="sub" x="583" y="411" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="10px">PY</text>
  <rect class="box" x="564" y="420" width="38" height="18" rx="4" fill="#993c1d" stroke="none"/>
  <text class="sub" x="583" y="433" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="10px">LLM</text>
  <text class="sub"  x="500" y="446" text-anchor="middle" fill="#854f0b">auto · own worktree</text>
  <text class="sub"  x="500" y="465" text-anchor="middle" fill="#854f0b">owns boundaries &amp; structure</text>
  <text class="sub"  x="500" y="484" text-anchor="middle" fill="#854f0b">runs /final-verification (mutation)</text>
  <text class="sub"  x="500" y="503" text-anchor="middle" fill="#854f0b">hands off the completed cycle</text>
</g>

