<!-- ===== footnotes ===== -->
<text class="note" x="675" y="544" text-anchor="middle">each auto role = Python scheduler + one-shot LLM worker per cycle · see scheduler-worker-detail diagram</text>
<text class="note" x="675" y="560" text-anchor="middle">scheduler guards: watchdog · verify gate · maxCycles / maxBudgetUsd · circuit breaker</text>

<text class="note" x="520" y="596" text-anchor="middle">The specifier routes back to human-in-the-loop only when the sender was the architect; every other handoff continues the cycle.</text>
<text class="note" x="520" y="612" text-anchor="middle">Messages live in .kiln/messages.db: queued → delivered → processing → processed.</text>
</svg>
