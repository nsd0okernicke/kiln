  <text class="sub" x="933" y="203" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="10px">LLM</text>
  <text class="sub"  x="850" y="216" text-anchor="middle" fill="#993c1d">auto · own worktree</text>
