  <rect class="box" x="914" y="420" width="38" height="18" rx="4" fill="#993c1d" stroke="none"/>
  <text class="sub" x="933" y="433" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="10px">LLM</text>
