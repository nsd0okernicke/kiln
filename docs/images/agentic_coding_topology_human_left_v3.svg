  <text class="sub"  x="500" y="236" text-anchor="middle" fill="#185fa5">scheduler (Python) +</text>
  <text class="sub"  x="500" y="252" text-anchor="middle" fill="#185fa5">worker (LLM) per cycle</text>
  <text class="sub"  x="500" y="272" text-anchor="middle" fill="#185fa5">writes Gherkin acceptance</text>
