<svg width="100%" viewBox="0 0 1120 950" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Scheduler mode: one cycle of role_scheduler.run_once()</title>
<desc>Scheduler mode. A Python process owns the pane and runs run_once repeatedly: poll the queue with fetch_and_deliver on .kiln/messages.db, sleeping and polling again when it is empty; receive the message by marking it processing, persisting tmp/handoff-in.md and logging it; check the guards — route resolved, maxCycles, maxBudgetUsd — then merge the sender's commit and record the squash anchor. Inside _delegate it runs the worker as a one-shot agent CLI subprocess with no MCP servers, applies the verify gate (a failing verify demotes the attempt to blocked), and asks whether the attempt is blocked with attempts left, retrying once if so. Leaving the loop it asks whether the worker is done; if not it escalates. Otherwise it hands off: no-op check, squash, INSERT, read the row back by id, mark processed and re-arm the circuit breaker, then loops back to polling. Guard breaches and an undone worker leave on a dashed rail into an escalation to human-in-the-loop, where the circuit breaker halts the role after three in a row. On the left, the one-shot worker process is a fresh CLI invocation per cycle that runs the TDD loop and prints KILN-STATUS done before exiting.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#a8422a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .name { font-size: 14px; font-weight: 500; }
    .sub  { font-size: 11.5px; font-weight: 400; }
    .edge { font-size: 12px; fill: #52514e; }
    .grp  { font-size: 12.5px; font-weight: 500; fill: #52514e; }
    .note { font-size: 10.5px; fill: #6b6a66; }
    .box  { stroke-width: 0.5; }
    .conn { fill: none; stroke: #898781; stroke-width: 1.5; }
    .dash { fill: none; stroke: #a8422a; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .cluster { fill: none; stroke: #898781; stroke-width: 0.5; stroke-dasharray: 4 4; opacity: 0.6; }
  </style>
</defs>

<rect x="0" y="0" width="1120" height="950" fill="#fcfcfb"/>

<!-- ================= ONE-SHOT WORKER PROCESS ================= -->
<rect class="cluster" x="40" y="300" width="480" height="420" rx="16"/>
<text class="grp" x="280" y="324" text-anchor="middle">one-shot worker — a fresh CLI process per cycle</text>

<g>
  <rect class="box" x="90" y="346" width="380" height="68" rx="8" fill="#faece7" stroke="#993c1d"/>
  <text class="sub" x="280" y="366" text-anchor="middle" fill="#712b13">claude -p --agents … --agent coder-worker</text>
  <text class="sub" x="280" y="384" text-anchor="middle" fill="#993c1d">--strict-mcp-config — zero MCP tools, no queue access</text>
  <text class="sub" x="280" y="400" text-anchor="middle" fill="#993c1d">--setting-sources project · --model from the profile</text>
</g>

<rect class="cluster" x="90" y="434" width="380" height="200" rx="12"/>
<text class="grp" x="280" y="454" text-anchor="middle">loop until all tests pass</text>

<g>
  <rect class="box" x="125" y="470" width="310" height="44" rx="8" fill="#faece7" stroke="#993c1d"/>
  <text class="sub" x="280" y="488" text-anchor="middle" fill="#712b13">/tdd-red</text>
  <text class="sub" x="280" y="504" text-anchor="middle" fill="#993c1d">one minimal failing test</text>
</g>
<line class="conn" x1="280" y1="514" x2="280" y2="526" marker-end="url(#arrow)"/>

<g>
  <rect class="box" x="125" y="528" width="310" height="44" rx="8" fill="#faece7" stroke="#993c1d"/>
  <text class="sub" x="280" y="546" text-anchor="middle" fill="#712b13">/tdd-green</text>
  <text class="sub" x="280" y="562" text-anchor="middle" fill="#993c1d">just enough code to pass it</text>
</g>
<line class="conn" x1="280" y1="572" x2="280" y2="584" marker-end="url(#arrow)"/>

<g>
  <rect class="box" x="125" y="586" width="310" height="44" rx="8" fill="#faece7" stroke="#993c1d"/>
  <text class="sub" x="280" y="604" text-anchor="middle" fill="#712b13">/tdd-refactor</text>
  <text class="sub" x="280" y="620" text-anchor="middle" fill="#993c1d">clean up while it stays green</text>
</g>

<path class="conn" d="M125 608 H106 V492 H123" marker-end="url(#arrow)"/>

<g>
  <rect class="box" x="90" y="654" width="380" height="52" rx="8" fill="#faece7" stroke="#993c1d"/>
  <text class="sub" x="280" y="674" text-anchor="middle" fill="#712b13">prints KILN-STATUS: done · reports cost and tokens</text>
  <text class="sub" x="280" y="692" text-anchor="middle" fill="#993c1d">then the process exits — nothing persists between cycles</text>
</g>

<!-- ================= SCHEDULER PROCESS ================= -->
<rect class="cluster" x="590" y="60" width="490" height="840" rx="16"/>
<text class="grp" x="835" y="84" text-anchor="middle">python -m scheduler.role_scheduler — the pane is a state machine</text>

<g>
  <rect class="box" x="660" y="100" width="330" height="64" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
  <text class="name" x="825" y="122" text-anchor="middle" fill="#0c447c">poll the queue</text>
  <text class="sub"  x="825" y="142" text-anchor="middle" fill="#185fa5">fetch_and_deliver() straight against SQLite</text>
  <text class="sub"  x="825" y="158" text-anchor="middle" fill="#185fa5">empty → sleep pollSeconds and poll again</text>
</g>
<line class="conn" x1="825" y1="164" x2="825" y2="182" marker-end="url(#arrow)"/>

<g>
  <rect class="box" x="660" y="184" width="330" height="64" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
  <text class="name" x="825" y="206" text-anchor="middle" fill="#0c447c">receive</text>
  <text class="sub"  x="825" y="226" text-anchor="middle" fill="#185fa5">mark_processing · persist tmp/handoff-in.md</text>
  <text class="sub"  x="825" y="242" text-anchor="middle" fill="#185fa5">parse the handoff · resolve the routing target</text>
</g>
<line class="conn" x1="825" y1="248" x2="825" y2="266" marker-end="url(#arrow)"/>

<g>
  <rect class="box" x="660" y="268" width="330" height="76" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
  <text class="name" x="825" y="290" text-anchor="middle" fill="#0c447c">guards, then merge</text>
  <text class="sub"  x="825" y="310" text-anchor="middle" fill="#185fa5">route resolved? · maxCycles · maxBudgetUsd</text>
  <text class="sub"  x="825" y="326" text-anchor="middle" fill="#185fa5">merge the sender's commit · record the squash anchor</text>
</g>
<line class="conn" x1="825" y1="344" x2="825" y2="396" marker-end="url(#arrow)"/>

<!-- delegate loop -->
<rect class="cluster" x="646" y="366" width="390" height="240" rx="12"/>
<text class="grp" x="656" y="386" text-anchor="start">_delegate — one retry loop</text>

<g>
  <rect class="box" x="660" y="400" width="330" height="60" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
  <text class="name" x="825" y="422" text-anchor="middle" fill="#0c447c">run the worker</text>
  <text class="sub"  x="825" y="442" text-anchor="middle" fill="#185fa5">subprocess · status: working / retrying N of max</text>
</g>
<line class="conn" x1="825" y1="460" x2="825" y2="476" marker-end="url(#arrow)"/>

<g>
  <rect class="box" x="660" y="478" width="330" height="54" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
  <text class="name" x="825" y="498" text-anchor="middle" fill="#0c447c">verify gate</text>
  <text class="sub"  x="825" y="517" text-anchor="middle" fill="#185fa5">a failing verify demotes the attempt to blocked</text>
</g>
<line class="conn" x1="825" y1="532" x2="825" y2="546" marker-end="url(#arrow)"/>

<g>
  <path d="M825 548 L935 579 L825 610 L715 579 Z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
  <text class="sub" x="825" y="583" text-anchor="middle" fill="#2b2a28">blocked, attempts left?</text>
</g>

<path class="conn" d="M937 579 H1010 V430 H992" marker-end="url(#arrow)"/>
<text class="edge" x="1010" y="418" text-anchor="middle">retry</text>

<line class="conn" x1="825" y1="610" x2="825" y2="632" marker-end="url(#arrow)"/>

<g>
  <path d="M825 634 L930 664 L825 694 L720 664 Z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
  <text class="sub" x="825" y="668" text-anchor="middle" fill="#2b2a28">worker done?</text>
</g>

<line class="conn" x1="825" y1="694" x2="825" y2="716" marker-end="url(#arrow)"/>
<text class="edge" x="847" y="712" text-anchor="middle">yes</text>

<g>
  <rect class="box" x="660" y="718" width="330" height="76" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
  <text class="name" x="825" y="740" text-anchor="middle" fill="#0c447c">hand off</text>
  <text class="sub"  x="825" y="760" text-anchor="middle" fill="#185fa5">no-op check → squash → INSERT → read back by id</text>
  <text class="sub"  x="825" y="776" text-anchor="middle" fill="#185fa5">mark_processed · re-arm the circuit breaker</text>
</g>

<path class="conn" d="M825 794 V822 H1056 V130 H992" marker-end="url(#arrow)"/>
<text class="edge" x="880" y="816" text-anchor="middle">loop</text>

<g>
  <rect class="box" x="660" y="838" width="330" height="56" rx="8" fill="#fce8e8" stroke="#a82a2a"/>
  <text class="name" x="825" y="860" text-anchor="middle" fill="#7a1a1a">escalate to human-in-the-loop</text>
  <text class="sub"  x="825" y="880" text-anchor="middle" fill="#a82a2a">circuit breaker halts the role after 3 in a row</text>
</g>

<!-- ================= cross edges ================= -->
<line class="conn" x1="658" y1="430" x2="474" y2="392" marker-end="url(#arrow)"/>
<text class="edge" x="562" y="398" text-anchor="middle">invoke</text>

<path class="conn" d="M472 680 C 545 680, 560 580, 656 506" marker-end="url(#arrow)"/>
<text class="edge" x="548" y="598" text-anchor="middle">stream-json</text>

<!-- failure rail, drawn last over bridge breaks in the two cross edges -->
<rect x="612" y="413" width="12" height="18" fill="#fcfcfb"/>
<rect x="612" y="533" width="12" height="18" fill="#fcfcfb"/>
<path class="dash" d="M658 306 H618 V866 H658" marker-end="url(#arrow-red)"/>
<line class="dash" x1="718" y1="664" x2="620" y2="664"/>
<text class="edge" x="704" y="656" text-anchor="middle">no</text>
<text class="edge" transform="translate(602,760) rotate(-90)" text-anchor="middle">escalate</text>

<text class="note" x="560" y="932" text-anchor="middle">Scheduler mode — the default for every shipped auto role. The LLM only does the work; run_once() makes every control-flow decision.</text>
</svg>
