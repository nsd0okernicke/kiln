<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln Cockpit</title>
<style>
  /* One file, no CDN, no build step. The cockpit is served by a stdlib HTTP server from a
     machine that may well be offline, so every byte the page needs is in it. */
  /* Themes are a token swap and nothing else: every rule below reads variables, so a theme
     redefines colours and no rule has to know a theme exists. The base `:root` set is the
     original dark palette and stays the fallback -- with JS disabled or localStorage
     unreadable, no `data-theme` is ever stamped and the page renders exactly as it always
     did, rather than unstyled. */
  :root {
    --bg: #12141a; --panel: #1a1d26; --line: #2b303d; --ink: #e6e9f0; --dim: #8b93a7;
    --accent: #7aa2f7; --ok: #7bd88f; --warn: #f2c55c; --bad: #f7768e; --hot: #ff9e64;
    /* Raised surfaces and controls. These were literal hex values inline, which is why a
       second palette was impossible without editing every rule. */
    --surface: #20242f; --btn-bg: #232735; --chip: #262b38; --chip-active: #2a3550;
    --chip-bad: #3a2430; --code-bg: #16191f; --on-accent: #10131a; --danger-line: #4a2530;
    --backdrop: rgba(0, 0, 0, .6);
    /* Neon's contribution. `none` everywhere else, so the glow rules cost nothing. */
    --glow: none; --dot-glow: none; --title-glow: none;
  }

  /* Accent and bad are a shade deeper than they look like they need to be, because the
     state pills set coloured text on a tinted chip at 12px -- the tightest contrast pair on
     the page. The lighter blue and red that read fine as button fills landed at 3.6:1 and
     3.9:1 there, under the 4.5:1 that size needs. These clear it on the chips and stay
     above 5:1 on white. */
  :root[data-theme="light"] {
    --bg: #f2f5fa; --panel: #ffffff; --line: #d8dee9; --ink: #161c26; --dim: #5b6678;
    --accent: #1f5ae0; --ok: #1a8f4c; --warn: #a5710f; --bad: #b82c2c; --hot: #c4600a;
    --surface: #f7f9fd; --btn-bg: #eceff6; --chip: #e7ecf4; --chip-active: #e6edff;
    --chip-bad: #fde9e9; --code-bg: #f4f7fb; --on-accent: #ffffff; --danger-line: #eec4c4;
    --backdrop: rgba(18, 24, 34, .35);
  }

  :root[data-theme="neon"] {
    --bg: #07070d; --panel: #0d0d18; --line: #261b45; --ink: #e9fbff; --dim: #837fb3;
    --accent: #00e5ff; --ok: #39ff88; --warn: #ffd23f; --bad: #ff2e88; --hot: #ff9f1c;
    --surface: #121221; --btn-bg: #17172b; --chip: #17172b; --chip-active: #0d3140;
    --chip-bad: #350a20; --code-bg: #05050b; --on-accent: #03141a; --danger-line: #5c1236;
    --backdrop: rgba(0, 0, 0, .72);
    /* Deliberately sparse: the live dot, the cards and the primary button. Glowing every
       element would cost legibility, which is the one thing an operator surface cannot
       trade away for looks. */
    --glow: 0 0 14px -6px var(--accent); --dot-glow: 0 0 8px currentColor;
    --title-glow: 0 0 12px rgba(0, 229, 255, .45);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0;
    z-index: 5; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; text-shadow: var(--title-glow); }
  .branch { color: var(--dim); font-size: 12px; }
  .spacer { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  /* `currentColor` so one glow token works for both states -- a red stale dot must not
     keep the green halo. */
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; color: var(--ok); box-shadow: var(--dot-glow);
  }
  .dot.stale { color: var(--bad); }
  button {
    font: inherit; color: var(--ink); background: var(--btn-bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent); color: var(--on-accent); border-color: var(--accent);
    font-weight: 600; box-shadow: var(--glow);
  }
  button.danger { border-color: var(--danger-line); color: var(--bad); }
  button.danger:hover { border-color: var(--bad); }

  /* Theme switcher: one segmented control, current choice filled in. */
  .themes { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .themes button {
    border: none; border-radius: 0; padding: 5px 10px; font-size: 12px;
    background: transparent; color: var(--dim);
  }
  .themes button + button { border-left: 1px solid var(--line); }
  .themes button:hover { color: var(--ink); background: var(--btn-bg); }
  .themes button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  main { padding: 18px; display: grid; gap: 18px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  section > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
    margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line);
  }
  .body { padding: 12px 14px; }
  .empty { color: var(--dim); font-style: italic; }

  /* Board */
  .lanes { display: flex; gap: 12px; overflow-x: auto; padding: 12px 14px; }
  .lane { min-width: 210px; flex: 1 1 210px; }
  .lane > h3 {
    font-size: 12px; margin: 0 0 8px; color: var(--dim); display: flex; gap: 6px;
    align-items: baseline;
  }
  .lane .count { font-variant-numeric: tabular-nums; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 10px;
    margin-bottom: 8px; cursor: pointer; box-shadow: var(--glow);
  }
  .card:hover { border-color: var(--accent); }
  .card.failed { border-left-color: var(--bad); }
  .card.done { border-left-color: var(--ok); opacity: .75; }
  /* A request the specifier has not named yet. Dashed and muted so it reads as provisional:
     it is real work, but its identity is still being decided and its title is borrowed
     prose, not a work-item name anything else can be grouped by. */
  .card.unnamed { border-left-style: dashed; border-left-color: var(--dim); }
  .card.unnamed .name { font-style: italic; color: var(--dim); }
  .card .name { font-weight: 600; word-break: break-word; }
  .card .meta { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .card .summary { color: var(--dim); font-size: 12px; margin-top: 6px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; }
  .state { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--chip); }
  .state.working, .state.retrying, .state.delegating { background: var(--chip-active); color: var(--accent); }
  .state.idle, .state.waiting { background: var(--chip); color: var(--dim); }
  .state.blocked, .state.halted { background: var(--chip-bad); color: var(--bad); }
  .heat { display: inline-block; width: 34px; height: 6px; border-radius: 3px; background: var(--chip); }
  .heat.warm { background: var(--warn); }
  .heat.hot { background: var(--hot); }
  .stall { color: var(--bad); }

  /* Attention */
  .attention { display: grid; gap: 8px; padding: 12px 14px; }
  .item {
    display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px;
    background: var(--surface); border-left: 3px solid var(--warn);
  }
  .item.failed { border-left-color: var(--bad); }
  .item.review { border-left-color: var(--ok); }
  .item .grow { flex: 1; min-width: 0; }
  .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .item .summary { word-break: break-word; }

  /* Composer + dialogs */
  textarea, input[type=text] {
    width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; font: inherit; resize: vertical;
  }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  dialog {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; width: min(620px, 92vw); padding: 0;
  }
  dialog::backdrop { background: var(--backdrop); }
  dialog h2 { font-size: 14px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  dialog .body { padding: 14px; }
  pre {
    white-space: pre-wrap; word-break: break-word; background: var(--code-bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px; max-height: 55vh; overflow: auto; font-size: 12px;
  }
  #toast {
    position: fixed; right: 18px; bottom: 18px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px;
    padding: 10px 14px; max-width: 380px; display: none;
  }
  #toast.bad { border-left-color: var(--bad); }
  .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<script>
// Runs before the header paints, deliberately. Applying the saved theme from the main
// script at the bottom would render one frame in the default palette first, and a page that
// flashes dark before turning light on every 2-second-polled reload is worse than no theme
// switcher at all.
(function () {
  "use strict";
  try {
    var saved = localStorage.getItem("kiln-cockpit-theme");
    // Only a name this page defines. A stale or hand-edited value must fall through to the
    // base `:root` palette rather than stamp an attribute nothing styles.
    if (saved === "dark" || saved === "light" || saved === "neon") {
      document.documentElement.dataset.theme = saved;
    }
  } catch (error) {
    // Private windows and blocked site data throw on access, not just on write. The page
    // works without a stored preference; it must not fail to render over one.
  }
})();
</script>
<header>
  <h1 id="project">Kiln Cockpit</h1>
  <span class="branch" id="branch"></span>
  <span class="live"><span class="dot" id="dot"></span><span id="updated">connecting…</span></span>
  <span class="spacer"></span>
  <div class="themes" id="themes" role="group" aria-label="Colour theme">
    <button type="button" data-theme-choice="dark">Dark</button>
    <button type="button" data-theme-choice="light">Light</button>
    <button type="button" data-theme-choice="neon">Neon</button>
  </div>
  <button class="primary" id="new-task">New task</button>
  <button class="danger" id="teardown">Stop swarm</button>
</header>

<main>
  <section>
    <h2>Attention</h2>
    <div class="attention" id="attention"></div>
  </section>

  <section>
    <h2>Board</h2>
    <div class="lanes" id="lanes"></div>
  </section>

  <div class="grid-2">
    <section>
      <h2>Work queue</h2>
      <div class="body" style="padding:0"><table id="queue"></table></div>
    </section>

    <section>
      <h2>Chat to the master agent</h2>
      <div class="body">
        <textarea id="chat-text" rows="3" placeholder="A note for the human-in-the-loop role's queue. Does not start a cycle."></textarea>
        <div class="row"><button id="chat-send">Send</button><span class="branch" id="chat-target"></span></div>
      </div>
    </section>
  </div>

  <section>
    <h2>Recent activity</h2>
    <div class="body" style="padding:0"><table id="activity"></table></div>
  </section>
</main>

<dialog id="task-dialog">
  <h2>New task</h2>
  <div class="body">
    <textarea id="task-summary" rows="5" placeholder="What do you want done? One or more sentences."></textarea>
    <div class="row">
      <input type="text" id="task-name" placeholder="Work-item name (optional — the specifier normally invents it)">
    </div>
    <div class="row">
      <button class="primary" id="task-send">Queue it</button>
      <button id="task-cancel">Cancel</button>
      <span class="spacer"></span><span class="branch" id="task-target"></span>
    </div>
  </div>
</dialog>

<dialog id="doc-dialog">
  <h2 id="doc-title">Handoff</h2>
  <div class="body">
    <pre id="doc-body"></pre>
    <div class="row">
      <button id="doc-close">Close</button>
      <span class="spacer"></span>
      <input type="text" id="doc-guidance" placeholder="Guidance for a retry (optional)" style="display:none">
      <button id="doc-retry" style="display:none">Retry</button>
    </div>
  </div>
</dialog>

<div id="toast"></div>

<script>
"use strict";
// Polling, not sockets: the terminal dashboard has redrawn on a 2s poll since it shipped.
const POLL_MS = 2000;
// Required by the server on every mutating request. It is not a secret and does not
// authenticate anyone — it only makes the request one a cross-origin page cannot forge
// without a preflight the server never approves.
const GUARD = { "X-Kiln-Cockpit": "1", "Content-Type": "application/json" };

const $ = (id) => document.getElementById(id);
let latest = null;

function toast(message, bad) {
  const el = $("toast");
  el.textContent = message;
  el.className = bad ? "bad" : "";
  el.style.display = "block";
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { el.style.display = "none"; }, 5000);
}

async function post(path, body) {
  const response = await fetch(path, {
    method: "POST", headers: GUARD, body: JSON.stringify(body || {}),
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.error || response.statusText);
  return payload;
}

function text(tag, value, className) {
  const el = document.createElement(tag);
  if (value !== undefined && value !== null) el.textContent = value;
  if (className) el.className = className;
  return el;
}

function money(value) { return value === null || value === undefined ? "—" : "$" + value.toFixed(2); }
function count(value) { return value === null || value === undefined ? "—" : value.toLocaleString(); }
function percent(value) { return value === null || value === undefined ? "—" : Math.round(value * 100) + "%"; }

function renderHeader(state) {
  $("project").textContent = state.project ? "Kiln Cockpit — " + state.project : "Kiln Cockpit";
  const totals = state.totals;
  $("branch").textContent =
    state.branch + " · " + money(totals.cost_usd) + (totals.cost_partial ? "+" : "") +
    " · " + count(totals.tokens) + " tok · " + totals.cycles + " cycles";
  $("chat-target").textContent = "→ " + state.human_role;
  $("task-target").textContent = state.intake_role ? "→ " + state.intake_role : "no intake role configured";
}

function renderAttention(state) {
  const host = $("attention");
  host.replaceChildren();
  if (!state.attention.length) {
    host.append(text("div", "Nothing waiting on you.", "empty"));
    return;
  }
  for (const item of state.attention) {
    const row = text("div", null, "item " + item.kind);
    const grow = text("div", null, "grow");
    grow.append(text("div", item.kind + " · " + item.role + (item.work_item ? " · " + item.work_item : ""), "kind"));
    grow.append(text("div", item.summary, "summary"));
    grow.append(text("div", (item.age || "") + " · " + item.message_id.slice(0, 8), "kind"));
    row.append(grow);

    const open = text("button", "Open");
    open.onclick = () => openDocument(item.message_id, item.retryable);
    row.append(open);
    if (item.retryable) {
      const retry = text("button", "Retry");
      retry.onclick = () => retryMessage(item.message_id, "");
      row.append(retry);
    }
    host.append(row);
  }
}

function renderBoard(state) {
  const host = $("lanes");
  host.replaceChildren();
  for (const lane of state.board.lanes) {
    const cards = state.board.cards[lane] || [];
    const column = text("div", null, "lane");
    const heading = text("h3");
    heading.append(text("span", lane));
    heading.append(text("span", cards.length, "count"));
    column.append(heading);
    if (!cards.length) column.append(text("div", "—", "empty"));
    for (const card of cards) {
      const el = text("div", null, "card"
        + (card.failed ? " failed" : "")
        + (card.unnamed ? " unnamed" : "")
        + (lane === "done" ? " done" : ""));
      // `title`, not `work_item`: an unnamed request has no work item yet and would render
      // a blank card, which is what made every new task invisible until the specifier
      // finished naming it.
      el.append(text("div", card.title, "name"));
      el.append(text("div", card.sender + " → " + card.target + " · " + card.cycles + " msgs · " + (card.age || ""), "meta"));
      // An unnamed card borrows its title from the summary, so printing both would say the
      // same sentence twice.
      if (card.summary && card.summary !== card.title) el.append(text("div", card.summary, "summary"));
      el.onclick = () => openDocument(card.message_id, card.failed);
      column.append(el);
    }
    host.append(column);
  }
}

function renderQueue(state) {
  const table = $("queue");
  table.replaceChildren();
  const head = table.insertRow();
  for (const label of ["Role", "State", "Since", "Work item", "Queue", "Wait", "Cycles", "Cost", "Tokens", "Cache", ""]) {
    head.append(text("th", label));
  }
  for (const role of state.roles) {
    const row = table.insertRow();
    row.append(text("td", role.role));

    const stateCell = text("td");
    stateCell.append(text("span", (role.state || "—") + (role.attempt ? " " + role.attempt : ""), "state " + (role.state || "")));
    row.append(stateCell);

    const since = text("td", (role.stalled ? "⚠ " : "") + (role.since_ago || "—"));
    if (role.stalled) since.className = "stall";
    row.append(since);

    row.append(text("td", role.work_item || "—"));
    row.append(text("td", role.queue, "num"));
    row.append(text("td", role.wait || "—", "num"));
    row.append(text("td", count(role.cycles), "num"));
    row.append(text("td", money(role.cost_usd), "num"));
    row.append(text("td", count(role.tokens), "num"));
    row.append(text("td", percent(role.cache_share), "num"));

    const heat = text("td");
    heat.append(text("span", "", "heat " + (role.heat >= 1 ? "hot" : role.heat > 0 ? "warm" : "")));
    row.append(heat);
  }
}

function renderActivity(state) {
  const table = $("activity");
  table.replaceChildren();
  const head = table.insertRow();
  for (const label of ["When", "From", "To", "Status", "Summary"]) head.append(text("th", label));
  for (const entry of state.activity) {
    const row = table.insertRow();
    row.append(text("td", entry.age || ""));
    row.append(text("td", entry.sender));
    row.append(text("td", entry.target));
    row.append(text("td", entry.status));
    const summary = text("td", (entry.escalation ? "⚠ " : "") + entry.summary);
    summary.style.cursor = "pointer";
    summary.onclick = () => openDocument(entry.message_id, false);
    row.append(summary);
  }
}

// --- theme -------------------------------------------------------------------------
// The inline script in <body> already applied the stored choice; this only wires the
// control and keeps the pressed state honest.
const THEMES = ["dark", "light", "neon"];
const THEME_KEY = "kiln-cockpit-theme";

function applyTheme(name) {
  if (!THEMES.includes(name)) name = "dark";
  // "dark" is the base `:root` palette, so it is expressed by removing the attribute
  // rather than by a `[data-theme="dark"]` block that would duplicate every token.
  if (name === "dark") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = name;
  for (const button of $("themes").querySelectorAll("button")) {
    button.setAttribute("aria-pressed", String(button.dataset.themeChoice === name));
  }
  try { localStorage.setItem(THEME_KEY, name); } catch (error) { /* preference is optional */ }
}

$("themes").onclick = (event) => {
  const choice = event.target.dataset && event.target.dataset.themeChoice;
  if (choice) applyTheme(choice);
};

applyTheme(document.documentElement.dataset.theme || "dark");

async function poll() {
  try {
    const response = await fetch("/api/state", { headers: { "X-Kiln-Cockpit": "1" } });
    if (!response.ok) throw new Error(response.statusText);
    latest = await response.json();
    $("dot").className = "dot";
    $("updated").textContent = "updated " + latest.generated_at.slice(11);
    renderHeader(latest);
    renderAttention(latest);
    renderBoard(latest);
    renderQueue(latest);
    renderActivity(latest);
  } catch (error) {
    // A failed poll marks the page stale rather than blanking it: the last known state is
    // more useful than an empty screen, and the swarm itself is unaffected either way.
    $("dot").className = "dot stale";
    $("updated").textContent = "no answer from the cockpit";
  }
}

async function openDocument(messageId, retryable) {
  const response = await fetch("/api/messages/" + messageId, { headers: { "X-Kiln-Cockpit": "1" } });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) return toast(payload.error || "could not read that message", true);
  $("doc-title").textContent = payload.sender + " → " + payload.target + " · " + (payload.work_item || "unnamed");
  $("doc-body").textContent = (payload.error ? "ERROR: " + payload.error + "\n\n" : "") + payload.content;
  $("doc-retry").style.display = retryable ? "" : "none";
  $("doc-guidance").style.display = retryable ? "" : "none";
  $("doc-retry").onclick = () => {
    retryMessage(messageId, $("doc-guidance").value);
    $("doc-dialog").close();
  };
  $("doc-dialog").showModal();
}

async function retryMessage(messageId, guidance) {
  try {
    const result = await post("/api/retry/" + messageId, { guidance: guidance || "" });
    toast("sent back to " + result.target);
    poll();
  } catch (error) { toast(error.message, true); }
}

$("new-task").onclick = () => $("task-dialog").showModal();
$("task-cancel").onclick = () => $("task-dialog").close();
$("task-send").onclick = async () => {
  try {
    const result = await post("/api/tasks", {
      summary: $("task-summary").value, name: $("task-name").value,
    });
    $("task-summary").value = ""; $("task-name").value = "";
    $("task-dialog").close();
    toast("queued for " + result.target);
    poll();
  } catch (error) { toast(error.message, true); }
};

$("chat-send").onclick = async () => {
  try {
    const result = await post("/api/chat", { summary: $("chat-text").value });
    $("chat-text").value = "";
    toast("delivered to " + result.target);
    poll();
  } catch (error) { toast(error.message, true); }
};

$("teardown").onclick = async () => {
  // Typed confirmation, matching what the endpoint itself demands: this stops every Kiln
  // process on the machine, agent panes included.
  if (prompt("This stops every Kiln process on this machine. Type TEARDOWN to confirm.") !== "TEARDOWN") return;
  try {
    await post("/api/teardown", { confirm: "TEARDOWN" });
    toast("stopping the swarm…");
  } catch (error) { toast(error.message, true); }
};

$("doc-close").onclick = () => $("doc-dialog").close();

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
