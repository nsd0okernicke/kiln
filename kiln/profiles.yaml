version: "1.0"
description: "Kiln configuration profiles for different development scenarios"

profiles:
  dev:
    description: "Local development setup with standard 4-agent swarm"
    terminals:
      - role: specifier
        agent: copilot
        worktree: "@current"
        title: "Kiln Specifier"
      - role: coder
        agent: claude
        worktree: "coder"
        title: "Kiln Coder"
      - role: refactorer
        agent: claude
        worktree: "refactorer"
        title: "Kiln Refactorer"
      - role: architect
        agent: claude
        worktree: "architect"
        title: "Kiln Architect"
    messageBackend: "sqlite"
    logLevel: "info"
    env:
      DEBUG: "false"

  ci:
    description: "CI/CD environment with minimal overhead"
    terminals:
      - role: coder
        agent: claude
        worktree: "@current"
        title: "Kiln CI"
    messageBackend: "sqlite"
    logLevel: "error"
    env:
      DEBUG: "false"

  selftest:
    description: "Automated self-testing configuration"
    terminals:
      - role: selftest
        agent: copilot
        worktree: "@current"
        title: "Kiln Self-Test"
      - role: specifier
        agent: claude
        worktree: "specifier"
        title: "Kiln Specifier"
      - role: coder
        agent: claude
        worktree: "coder"
        title: "Kiln Coder"
      - role: refactorer
        agent: claude
        worktree: "refactorer"
        title: "Kiln Refactorer"
      - role: architect
        agent: claude
        worktree: "architect"
        title: "Kiln Architect"
    messageBackend: "sqlite"
    logLevel: "debug"
    env:
      DEBUG: "true"
      Kiln_SELFTEST_MODE: "true"

  debug:
    description: "Development with verbose logging and debugging enabled"
    terminals:
      - role: specifier
        agent: claude
        worktree: "specifier"
        title: "Kiln Specifier [DEBUG]"
      - role: coder
        agent: claude
        worktree: "coder"
        title: "Kiln Coder [DEBUG]"
      - role: refactorer
        agent: claude
        worktree: "refactorer"
        title: "Kiln Refactorer [DEBUG]"
      - role: architect
        agent: claude
        worktree: "architect"
        title: "Kiln Architect [DEBUG]"
    messageBackend: "sqlite"
    logLevel: "debug"
    env:
      DEBUG: "true"
      Kiln_VERBOSE_EVENTS: "true"

  minimal:
    description: "Minimal setup for lightweight testing"
    terminals:
      - role: coder
        agent: claude
        worktree: "@current"
        title: "Kiln Coder"
    messageBackend: "sqlite"
    logLevel: "warn"
    env:
      DEBUG: "false"

  copilot-test:
    description: "Single Copilot agent for MCP testing"
    terminals:
      - role: coder
        agent: copilot
        worktree: "@current"
        title: "Kiln Copilot Test"
    messageBackend: "sqlite"
    logLevel: "info"
    env:
      DEBUG: "false"

