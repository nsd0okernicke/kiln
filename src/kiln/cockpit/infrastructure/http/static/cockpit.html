<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln Cockpit</title>
<style>
  /* One file, no CDN, no build step. The cockpit is served by a stdlib HTTP server from a
     machine that may well be offline, so every byte the page needs is in it. */
  /* Themes are a token swap and nothing else: every rule below reads variables, so a theme
     redefines colours and no rule has to know a theme exists. The base `:root` set is the
     original dark palette and stays the fallback -- with JS disabled or localStorage
     unreadable, no `data-theme` is ever stamped and the page renders exactly as it always
     did, rather than unstyled. */
  :root {
    --bg: #12141a; --panel: #1a1d26; --line: #2b303d; --ink: #e6e9f0; --dim: #8b93a7;
    --accent: #7aa2f7; --ok: #7bd88f; --warn: #f2c55c; --bad: #f7768e; --hot: #ff9e64;
    /* Raised surfaces and controls. These were literal hex values inline, which is why a
       second palette was impossible without editing every rule. */
    --surface: #20242f; --btn-bg: #232735; --chip: #262b38; --chip-active: #2a3550;
    --chip-bad: #3a2430; --code-bg: #16191f; --on-accent: #10131a; --danger-line: #4a2530;
    --backdrop: rgba(0, 0, 0, .6);
    /* Neon's contribution. `none` everywhere else, so the glow rules cost nothing. */
    --glow: none; --dot-glow: none; --title-glow: none; --logo-glow: none;
    /* The brighter half of the working-card pulse. Equal to --glow everywhere the
       theme has no glow, so the animation moves colour only, never shadow. */
    --glow-active: none;
    /* One hue per backend, so a mixed-backend swarm is readable at a glance without a
       logo. Every one of these clears 4.5:1 against its theme's --panel. */
    --agent-claude: #e8925e; --agent-codex: #6fd3a3;
    --agent-copilot: #b48ef0; --agent-grok: #9fb3d1; --agent-pi: #d7a84b;
  }

  /* Accent and bad are a shade deeper than they look like they need to be, because the
     state pills set coloured text on a tinted chip at 12px -- the tightest contrast pair on
     the page. The lighter blue and red that read fine as button fills landed at 3.6:1 and
     3.9:1 there, under the 4.5:1 that size needs. These clear it on the chips and stay
     above 5:1 on white. */
  :root[data-theme="light"] {
    --bg: #f2f5fa; --panel: #ffffff; --line: #d8dee9; --ink: #161c26; --dim: #5b6678;
    --accent: #1f5ae0; --ok: #1a8f4c; --warn: #a5710f; --bad: #b82c2c; --hot: #c4600a;
    --surface: #f7f9fd; --btn-bg: #eceff6; --chip: #e7ecf4; --chip-active: #e6edff;
    --chip-bad: #fde9e9; --code-bg: #f4f7fb; --on-accent: #ffffff; --danger-line: #eec4c4;
    --backdrop: rgba(18, 24, 34, .35);
    --agent-claude: #a4551d; --agent-codex: #12734d;
    --agent-copilot: #6b39b8; --agent-grok: #445876; --agent-pi: #936900;
  }

  :root[data-theme="neon"] {
    --bg: #07070d; --panel: #0d0d18; --line: #261b45; --ink: #e9fbff; --dim: #837fb3;
    --accent: #00e5ff; --ok: #39ff88; --warn: #ffd23f; --bad: #ff2e88; --hot: #ff9f1c;
    --surface: #121221; --btn-bg: #17172b; --chip: #17172b; --chip-active: #0d3140;
    --chip-bad: #350a20; --code-bg: #05050b; --on-accent: #03141a; --danger-line: #5c1236;
    --backdrop: rgba(0, 0, 0, .72);
    /* Deliberately sparse: the live dot, the cards and the primary button. Glowing every
       element would cost legibility, which is the one thing an operator surface cannot
       trade away for looks. */
    --glow: 0 0 14px -6px var(--accent); --dot-glow: 0 0 8px currentColor;
    --title-glow: 0 0 12px rgba(0, 229, 255, .45);
    --logo-glow: drop-shadow(0 0 6px rgba(0, 229, 255, .55));
    --glow-active: 0 0 18px -4px var(--hot);
    --agent-claude: #ff9f4d; --agent-codex: #39ff88;
    --agent-copilot: #c77dff; --agent-grok: #8fe8ff; --agent-pi: #ffd166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0;
    z-index: 5; flex-wrap: wrap;
  }
  /* Brand */
  .brand {
    display: inline-flex; align-items: center; gap: 9px; text-decoration: none;
    color: var(--ink);
  }
  .logo {
    width: 22px; height: 23px; fill: currentColor; color: var(--accent);
    filter: var(--logo-glow);
  }
  .wordmark { font-size: 15px; font-weight: 600; letter-spacing: .01em; text-shadow: var(--title-glow); }
  .wordmark-dim { color: var(--dim); font-weight: 500; margin-left: .35em; }

  /* Identity chips: which project, which branch. */
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    color: var(--dim); background: var(--chip); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px; max-width: 34ch;
  }
  .chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #branch-chip { color: var(--accent); }
  #version-header { color: var(--dim); font-size: 12px; font-weight: 500; margin-left: 6px; }
  .icon { width: 13px; height: 13px; flex: none; }
  .totals { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .totals b { color: var(--ink); font-weight: 600; }
  .branch { color: var(--dim); font-size: 12px; }
  .spacer { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  /* `currentColor` so one glow token works for both states -- a red stale dot must not
     keep the green halo. */
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; color: var(--ok); box-shadow: var(--dot-glow);
  }
  .dot.stale { color: var(--bad); }
  button {
    font: inherit; color: var(--ink); background: var(--btn-bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.action, button.primary {
    background: var(--accent); color: var(--on-accent); border-color: var(--accent);
    font-weight: 600; box-shadow: var(--glow);
  }
  button.danger { border-color: var(--danger-line); color: var(--bad); }
  button.danger:hover { border-color: var(--bad); }
  .toggle-switch {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    user-select: none; vertical-align: middle; margin-left: 8px;
  }
  .toggle-switch input { display: none; }
  .toggle-track {
    position: relative; width: 30px; height: 16px; border-radius: 8px;
    background: var(--dim); transition: background 0.2s; flex-shrink: 0;
  }
  .toggle-switch input:checked + .toggle-track { background: var(--accent); }
  .toggle-knob {
    position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--bg); transition: left 0.2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .toggle-switch input:checked + .toggle-track .toggle-knob { left: 16px; }
  .toggle-label { font-size: 11px; color: var(--dim); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .toggle-switch input:checked + .toggle-track + .toggle-label { color: var(--accent); }
  button.action { border-color: var(--accent); color: var(--on-accent); }
  button.action:hover { background: var(--accent); color: var(--on-accent); }
  button.action.active { background: var(--accent); color: var(--on-accent); }
  button.action.small { font-size: 11px; padding: 0 8px; height: 24px; border-radius: 5px; vertical-align: middle; }

  /* Theme switcher: one segmented control, current choice filled in. */
  .themes { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .themes button {
    border: none; border-radius: 0; padding: 5px 10px; font-size: 12px;
    background: transparent; color: var(--dim);
  }
  .themes button + button { border-left: 1px solid var(--line); }
  .themes button:hover { color: var(--ink); background: var(--btn-bg); }
  .themes button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  main { padding: 18px; display: grid; gap: 18px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  section > h2 { margin: 0; }
  .section-toggle {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    color: var(--dim); background: transparent; border: 0; border-radius: 10px 10px 0 0;
    padding: 10px 14px; font-size: 12px; font-weight: 600; text-align: left;
    text-transform: uppercase; letter-spacing: .08em;
  }
  .section-toggle:hover { color: var(--ink); background: var(--surface); }
  .section-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .section-toggle[aria-expanded="true"] { border-bottom: 1px solid var(--line); }
  .section-toggle[aria-expanded="false"] { border-radius: 10px; }
  .section-toggle::after {
    content: ""; width: 7px; height: 7px; flex: none; margin-left: 12px;
    border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: rotate(45deg); transition: transform .15s ease;
  }
  .section-toggle[aria-expanded="false"]::after { transform: rotate(-45deg); }
  .section-panel[hidden] { display: none; }
  .body { padding: 12px 14px; }
  .empty { color: var(--dim); font-style: italic; }

  /* Test health: one operational line, plus failing names only when there are any. */
  .health { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .health .verdict { font-weight: 600; white-space: nowrap; }
  .health.passed .verdict { color: var(--ok); }
  .health.failed .verdict { color: var(--bad); }
  .health.stale .verdict { color: var(--warn); }
  .health.unavailable .verdict { color: var(--dim); }
  .health .facts { color: var(--dim); min-width: 0; word-break: break-word; }
  .health .source { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .health-names { margin-top: 6px; color: var(--bad); font-size: 12px; word-break: break-word; }

  /* Board */
  .lanes { display: flex; gap: 12px; overflow-x: auto; padding: 12px 14px; }
  .pipeline { display: flex; gap: 0; align-items: flex-start; padding: 8px 0; min-width: fit-content; width: 100%; }
  .pipeline-stage { min-width: 170px; max-width: 220px; flex: 1 1 170px; padding: 8px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
  .pipeline-stage.has-cards { border-color: var(--accent); }
  .pipeline-header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .pipeline-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); }
  .pipeline-count { font-size: 11px; font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 999px; padding: 0 7px; line-height: 18px; }
  .pipeline-worktree { font-size: 10px; color: var(--dim); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pipeline-arrow { display: flex; align-items: center; justify-content: center; min-width: 24px; color: var(--dim); font-size: 14px; flex: none; padding: 8px 2px; margin-top: 2px; }
  .pipeline-cards { display: flex; flex-direction: column; gap: 6px; }
  .pipeline-stage .card { margin-bottom: 0; }
  .pipeline-fallback { padding: 8px 14px; }
  .lane { min-width: 210px; flex: 1 1 210px; }
  .lane > h3 {
    margin: 0 0 10px; color: var(--dim); display: flex; flex-direction: column;
    gap: 2px; align-items: flex-start;
  }
  .lane > h3 > span:first-child { color: var(--ink); font-size: 16px; font-weight: 600; }
  .lane .count { font-variant-numeric: tabular-nums; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 10px;
    margin-bottom: 8px; cursor: pointer; box-shadow: var(--glow);
  }
  .card:hover { border-color: var(--accent); }
  .card.failed { border-left-color: var(--bad); }
  .card.done { border-left-color: var(--ok); opacity: .75; }
  .card.review { border-left-color: var(--warn); }
  .card.review .name::after { content: " ⏳"; color: var(--warn); font-weight: 400; }

  /* A card whose message is `processing` -- a worker is running on it *right now*. Tied to
     real state rather than sprinkled on every card, so the movement means something: if
     something is pulsing, the swarm is burning tokens. A board where everything shimmers
     says nothing at all. */
  @keyframes card-working {
    0%, 100% { border-left-color: var(--accent); box-shadow: var(--glow); }
    50% { border-left-color: var(--hot); box-shadow: var(--glow-active); }
  }
  .card.working { animation: card-working 2.6s ease-in-out infinite; }
  .card.working .name::after {
    content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--hot); margin-left: 7px; vertical-align: middle;
    animation: card-working-dot 2.6s ease-in-out infinite;
  }
  @keyframes card-working-dot { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  /* An operator surface must not force motion on anyone who has asked the OS for less of
     it. The state stays readable without the animation -- the lane and the pulse dot's
     colour already carry it. */
  @media (prefers-reduced-motion: reduce) {
    .card.working, .card.working .name::after { animation: none; }
    .card.working { border-left-color: var(--hot); }
    .section-toggle::after { transition: none; }
  }
  /* A request the specifier has not named yet. Dashed and muted so it reads as provisional:
     it is real work, but its identity is still being decided and its title is borrowed
     prose, not a work-item name anything else can be grouped by. */
  .card.unnamed { border-left-style: dashed; border-left-color: var(--dim); }
  .card.unnamed .name { font-style: italic; color: var(--dim); }
  .card .work-item-id {
    color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: .04em;
    margin-bottom: 3px; word-break: break-word;
  }
  .card .name { font-weight: 600; word-break: break-word; }
  .card .meta { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .card .summary { color: var(--dim); font-size: 12px; margin-top: 6px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; }
  .state { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--chip); }
  .state.working, .state.retrying, .state.delegating { background: var(--chip-active); color: var(--accent); }
  .state.idle, .state.waiting { background: var(--chip); color: var(--dim); }
  .state.blocked, .state.halted { background: var(--chip-bad); color: var(--bad); }
  /* Which backend, and on which model. Text rather than vendor marks: the page is served
     offline and self-contained, so a logo would have to be drawn from memory, and a
     not-quite-right vendor mark is worse than an accurate word. Colour carries the
     at-a-glance signal instead. */
  .agent-cell { white-space: nowrap; }
  .agent { font-weight: 600; }
  .agent-claude { color: var(--agent-claude); }
  .agent-codex { color: var(--agent-codex); }
  .agent-copilot { color: var(--agent-copilot); }
  .agent-grok { color: var(--agent-grok); }
  .agent-pi { color: var(--agent-pi); }
  .model { color: var(--dim); font-size: 12px; margin-left: 6px; }
  .heat { display: inline-block; width: 34px; height: 6px; border-radius: 3px; background: var(--chip); }
  .heat.warm { background: var(--warn); }
  .heat.hot { background: var(--hot); }
  .stall { color: var(--bad); }

  /* Attention */
  .attention { display: grid; gap: 8px; padding: 12px 14px; }
  .item {
    display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px;
    background: var(--surface); border-left: 3px solid var(--warn);
  }
  .item.failed { border-left-color: var(--bad); }
  .item.review { border-left-color: var(--ok); }
  .item .grow { flex: 1; min-width: 0; }
  .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .item .summary { word-break: break-word; }

  /* Composer + dialogs */
  textarea, input[type=text] {
    width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; font: inherit; resize: vertical;
  }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .field { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .field label { font-size: 12px; color: var(--dim); width: 68px; flex: none; }
  select {
    flex: 1; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font: inherit;
  }
  /* Sending to a halted role is a silent no-op -- the circuit breaker makes it read only
     what `kiln retry` re-queued -- so the one thing this must not do is stay quiet. */
  .warn-note {
    font-size: 12px; color: var(--warn); background: var(--chip);
    border-left: 3px solid var(--warn); border-radius: 4px; padding: 6px 9px; margin-bottom: 8px;
  }
  .row-send { padding: 2px 8px; font-size: 12px; }
  #queue tr.role-row { cursor: pointer; }
  #queue tr.role-row:hover { background: var(--surface); }
  .log-cell { padding: 10px; background: var(--code-bg); }
  .log-toolbar, .detail-toolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .log-toolbar button { padding: 2px 8px; font-size: 12px; }
  .log-toolbar button.active { color: var(--accent); border-color: var(--accent); }
  .copy-all { display: inline-flex; align-items: center; justify-content: center; padding: 4px 7px; }
  .copy-all .icon { width: 14px; height: 14px; }
  .live-log { margin: 0; max-height: 320px; white-space: pre-wrap; }
  #role-dialog { width: min(960px, 94vw); }
  #role-dialog .live-log { min-height: 180px; max-height: 55vh; }
  .lane-worktree { display: inline-flex; align-items: center; color: var(--dim); font-size: 11px; font-weight: 400; }
  .role-details { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  .role-details b { color: var(--ink); font-weight: 500; }
  .queue-composer { border-bottom: 1px solid var(--line); }
  .queue-compose-grid { display: grid; grid-template-columns: 1fr 1fr 2fr auto; gap: 8px; align-items: end; }
  .queue-compose-grid .field { display: block; margin: 0; }
  .queue-compose-grid .field label { display: block; width: auto; margin-bottom: 3px; }
  .queue-compose-grid textarea { min-height: 38px; resize: vertical; }
  dialog {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; width: min(620px, 92vw); padding: 0;
  }
  dialog::backdrop { background: var(--backdrop); }
  dialog h2 { font-size: 14px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  dialog .body { padding: 14px; }
  pre {
    white-space: pre-wrap; word-break: break-word; background: var(--code-bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px; max-height: 55vh; overflow: auto; font-size: 12px;
  }
  #toast {
    position: fixed; right: 18px; bottom: 18px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px;
    padding: 10px 14px; max-width: 380px; display: none;
  }
  #toast.bad { border-left-color: var(--bad); }
  .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; }
  @media (max-width: 900px) {
    .grid-2, .queue-compose-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<script>
// Runs before the header paints, deliberately. Applying the saved theme from the main
// script at the bottom would render one frame in the default palette first, and a page that
// flashes dark before turning light on every 2-second-polled reload is worse than no theme
// switcher at all.
(function () {
  "use strict";
  try {
    var saved = localStorage.getItem("kiln-cockpit-theme");
    // Only a name this page defines. A stale or hand-edited value must fall through to the
    // base `:root` palette rather than stamp an attribute nothing styles.
    if (saved === "dark" || saved === "light" || saved === "neon") {
      document.documentElement.dataset.theme = saved;
    }
  } catch (error) {
    // Private windows and blocked site data throw on access, not just on write. The page
    // works without a stored preference; it must not fail to render over one.
  }
})();
</script>
<!-- Icon sprite. Inline SVG rather than the PNG as a data URI or emoji: it inherits
     `currentColor`, so every glyph re-tints itself with the theme for free, and it stays
     crisp at any zoom. The kiln mark is traced from docs/images/logo.png at its own
     228x238 scale, which is why these coordinates are not round numbers. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-kiln" viewBox="0 0 228 238">
    <mask id="kiln-slots">
      <rect x="15" y="13" width="196" height="188" rx="14" fill="#fff"/>
      <rect x="45" y="41" width="136" height="13" rx="6.5" fill="#000"/>
      <rect x="45" y="79" width="136" height="13" rx="6.5" fill="#000"/>
      <rect x="45" y="118" width="136" height="13" rx="6.5" fill="#000"/>
    </mask>
    <rect x="15" y="13" width="196" height="188" rx="14" mask="url(#kiln-slots)"/>
    <path d="M38 199 H66 L53 226 H29 Z"/>
    <path d="M158 199 H187 L196 226 H171 Z"/>
  </symbol>
  <symbol id="i-folder" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"

<div id="toast"></div>

<script>
"use strict";
// Polling, not sockets: the terminal dashboard has redrawn on a 2s poll since it shipped.
const POLL_MS = 2000;
// Required by the server on every mutating request. It is not a secret and does not
// authenticate anyone — it only makes the request one a cross-origin page cannot forge
// without a preflight the server never approves.
const GUARD = { "X-Kiln-Cockpit": "1", "Content-Type": "application/json" };
const SECTION_STATE_KEY = "kiln-cockpit-collapsed-sections";

const $ = (id) => document.getElementById(id);
let latest = null;
let expandedRole = null;
let editingTask = null;
let logStream = "scheduler";
const logOffsets = { scheduler: 0, worker: 0 };
const logText = { scheduler: "", worker: "" };

function storedCollapsedSections() {
  try {
    const value = JSON.parse(localStorage.getItem(SECTION_STATE_KEY) || "[]");
    return new Set(Array.isArray(value) ? value : []);
  } catch (error) { return new Set(); }
}

function setSectionExpanded(button, expanded) {
  button.setAttribute("aria-expanded", String(expanded));
  $(button.getAttribute("aria-controls")).hidden = !expanded;
}

const collapsedSections = storedCollapsedSections();

function storeCollapsedSections() {
  try { localStorage.setItem(SECTION_STATE_KEY, JSON.stringify([...collapsedSections])); }
  catch (error) { /* preference is optional */ }
}

function expandSection(name) {
  const section = document.querySelector('section[data-section="' + name + '"]');
  if (!section) return;
  setSectionExpanded(section.querySelector(".section-toggle"), true);
  collapsedSections.delete(name);
  storeCollapsedSections();
}

function initialiseSectionToggles() {
  for (const section of document.querySelectorAll("section[data-section]")) {
    const button = section.querySelector(".section-toggle");
    setSectionExpanded(button, !collapsedSections.has(section.dataset.section));
    button.onclick = () => {
      const expanded = button.getAttribute("aria-expanded") !== "true";
      setSectionExpanded(button, expanded);
      if (expanded) collapsedSections.delete(section.dataset.section);
      else collapsedSections.add(section.dataset.section);
      storeCollapsedSections();
    };
  }
}

initialiseSectionToggles();

function toast(message, bad) {
  const el = $("toast");
  el.textContent = message;
  el.className = bad ? "bad" : "";
  el.style.display = "block";
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { el.style.display = "none"; }, 5000);
}

async function copyAll(sourceId) {
  const source = $(sourceId);
  const content = source ? source.textContent : "";
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(content);
    } else {
      const fallback = document.createElement("textarea");
      fallback.value = content;
      fallback.setAttribute("readonly", "");
      fallback.style.position = "fixed";
      fallback.style.opacity = "0";
      document.body.append(fallback);
      fallback.select();
      const copied = document.execCommand("copy");
      fallback.remove();
      if (!copied) throw new Error("clipboard unavailable");
    }
    toast("copied all content");
  } catch (error) {
    toast("could not copy content", true);
  }
}

function copyButton(sourceId) {
  const button = text("button", null, "copy-all");
  button.type = "button";
  button.setAttribute("aria-label", "Copy all");
  button.title = "Copy all";
  const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  icon.setAttribute("class", "icon");
  icon.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", "#i-copy");
  icon.append(use);
  button.append(icon);
  button.onclick = () => copyAll(sourceId);
  return button;
}

async function post(path, body) {
  const response = await fetch(path, {
    method: "POST", headers: GUARD, body: JSON.stringify(body || {}),
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.error || response.statusText);
  return payload;
}

function text(tag, value, className) {
  const el = document.createElement(tag);
  if (value !== undefined && value !== null) el.textContent = value;
  if (className) el.className = className;
  return el;
}

function money(value) { return value === null || value === undefined ? "—" : "$" + value.toFixed(2); }
function count(value) { return value === null || value === undefined ? "—" : value.toLocaleString(); }
function ratioPercent(value) { return value === null || value === undefined ? "—" : Math.round(value * 100) + "%"; }

function renderHeader(state) {
  // Project and branch are the two facts an operator re-checks constantly -- "am I looking
  // at the right swarm" -- and they used to be one run-on string alongside the totals.
  $("project").textContent = state.project || "(unnamed project)";
  $("branch").textContent = state.branch;
  $("version-header").textContent = state.version || "";
  $("project-chip").title = "Project: " + (state.project || "unknown");
  $("branch-chip").title = "Branch: " + state.branch + " — messages are scoped to it";

  const totals = state.totals;
  const host = $("totals");
  host.replaceChildren();
  // `+` when some role's backend reports no cost at all: the total is structurally
  // incomplete rather than small, and the marker is the only thing that says so.
  const parts = [
    [money(totals.cost_usd) + (totals.cost_partial ? "+" : ""), "spent"],
    [count(totals.tokens), "tokens"],
    [String(totals.cycles), totals.cycles === 1 ? "cycle" : "cycles"],
  ];
  parts.forEach(([value, label], index) => {
    if (index) host.append(text("span", " · "));
    host.append(text("b", value));
    host.append(text("span", " " + label));
  });

}

// --- composer ----------------------------------------------------------------------
// One composer for every outbound message. `New task` and the row buttons are presets over
// it, so there is a single place a handoff can be typed and a single place it can go wrong.
const ITEM_PENDING = "pending";
const ITEM_OTHER = "__other__";  // cannot collide with a work-item name

function option(value, label) {
  const el = document.createElement("option");
  el.value = value;
  el.textContent = label;
  return el;
}

// `<select>` is rebuilt every poll, so the operator's half-made choice has to survive it.
function renderSend(state) {
  const target = $("send-target");
  const keptTarget = target.value;
  target.replaceChildren(...state.roles.map((role) => option(role.role, role.role)));
  target.value = keptTarget || state.intake_role || "";
  if (!target.value && target.options.length) target.selectedIndex = 0;

  const item = $("send-item");
  const keptItem = item.value;
  item.replaceChildren(
    option(ITEM_PENDING, "new — the specifier names it"),
    ...state.work_items.map((name) => option(name, name)),
    option(ITEM_OTHER, "other… (type a name)"),
  );
  // A work item that has since scrolled out of the list must not silently become `pending`.
  item.value = [...item.options].some((o) => o.value === keptItem) ? keptItem : ITEM_PENDING;
  $("send-item-other").style.display = item.value === ITEM_OTHER ? "" : "none";

  renderSendWarning();
}

function renderSendWarning() {
  const note = $("send-warning");
  const role = latest && latest.roles.find((r) => r.role === $("send-target").value);
  // A halted role reads only what `kiln retry` re-queued (`run_once` polls `fetch_resume`,
  // which needs `acked_at`), so an ordinary send sits unread. Warn rather than refuse:
  // queueing work for after it recovers is legitimate.
  if (role && role.state === "halted") {
    note.textContent =
      role.role + " is halted by the circuit breaker and reads only messages resumed from " +
      "Attention. This will sit unread until you retry its failed message.";
    note.style.display = "";
  } else {
    note.style.display = "none";
  }
  $("send-hint").textContent = latest && $("send-target").value === latest.human_role
    ? "the inbox pane shows this; it does not start a cycle"
    : "";
}

// Used by the header button and by each Work Queue row.
function prefillSend(role, workItem) {
  if (role) $("send-target").value = role;
  const item = $("send-item");
  item.value = [...item.options].some((o) => o.value === workItem) ? workItem : ITEM_PENDING;
  $("send-item-other").style.display = "none";
  renderSendWarning();
}

function revealComposer(role, workItem) {
  expandSection("work-queue");
  prefillSend(role, workItem);
  $("queue-composer").scrollIntoView({ block: "nearest" });
  $("send-text").focus();
}

function renderAttention(state) {
  const host = $("attention");
  host.replaceChildren();
  if (!state.attention.length) {
    host.append(text("div", "Nothing waiting on you.", "empty"));
    return;
  }
  for (const item of state.attention) {
    const row = text("div", null, "item " + item.kind);
    const grow = text("div", null, "grow");
    grow.append(text("div", item.kind + " · " + item.role + (item.work_item ? " · " + item.work_item : ""), "kind"));
    grow.append(text("div", item.summary, "summary"));
    grow.append(text("div", (item.age || "") + " · " + item.message_id.slice(0, 8), "kind"));
    row.append(grow);

    const open = text("button", "Open");
    open.onclick = () => openDocument(item.message_id, item.retryable);
    row.append(open);
    if (item.retryable) {
      const retry = text("button", "Retry");
      retry.onclick = () => retryMessage(item.message_id, "");
      row.append(retry);
    } else if (item.kind === "review") {
      const acknowledge = text("button", "Acknowledge");
      acknowledge.onclick = () => acknowledgeMessage(item.message_id);
      row.append(acknowledge);
    }
    host.append(row);
  }
}

// Reports are written by CI, a verify step or a developer — never by the cockpit, which only
// reads them (issue #27). Unknown metrics are omitted rather than shown as zero: "no coverage
// configured" and "nothing covered" must not look alike.
const HEALTH_VERDICT = { passed: "✓", failed: "✕", stale: "⏱", unavailable: "—" };

function renderTestMetrics(metrics) {
  const host = $("test-health");
  host.replaceChildren();
  if (!metrics) return;

  if (metrics.status === "unavailable" && !metrics.tests) {
    // The server's sentence names the file and the fix; this fallback only covers a payload
    // that somehow arrived without one.
    host.append(text("div", metrics.error || "No test reports configured.", "empty"));
    return;
  }

  const row = text("div", null, "health " + metrics.status);
  row.append(text("span", HEALTH_VERDICT[metrics.status] || "—", "verdict"));

  const facts = [];
  if (metrics.failed) facts.push(metrics.failed + " failed");
  if (metrics.passed !== null && metrics.passed !== undefined) facts.push(metrics.passed + " passed");
  if (metrics.skipped) facts.push(metrics.skipped + " skipped");
  if (metrics.duration_sec !== null && metrics.duration_sec !== undefined) {
    facts.push(metrics.duration_sec.toFixed(1) + "s");
  }
  if (metrics.coverage) facts.push(...coverageFacts(metrics.coverage));
  // A configured analyser that found nothing is "0 lint" — a fact. An unconfigured one is
  // absent entirely, because unknown and zero are different answers.
  if (metrics.lint) facts.push(lintFact(metrics.lint));
  if (metrics.updated_at) facts.push("updated " + healthAge(metrics.updated_at));
  row.append(text("span", facts.join(" · "), "facts"));
  // Keep a literal separator in the text, not only a CSS flex gap. Browser copy/paste does
  // not preserve layout gaps and previously produced "updated 57s agopytest".
  if (metrics.source) row.append(text("span", "· " + metrics.source, "source"));
  host.append(row);

  if (metrics.stale) {
    host.append(text("div", "Older than " + metrics.max_age_minutes + " minutes — this result may not describe the current tree.", "empty"));
  }
  if (metrics.failed_names && metrics.failed_names.length) {
    host.append(text("div", metrics.failed_names.join(", "), "health-names"));
  }
}

// Line coverage keeps the bare word "coverage" because that is what it is usually taken to
// mean. Branch coverage is shown only when the project measured it — most tools leave it off
// by default, and an unmeasured 0% would read as a disaster rather than as a setting.
// "statements" is the coverage tool's own count of executable lines, which is a size the
// panel can state in any language without Kiln knowing one.
function coverageFacts(coverage) {
  const facts = [reportPercent(coverage.line_percent) + " coverage"];
  if (coverage.branch_percent !== null && coverage.branch_percent !== undefined) {
    facts.push(reportPercent(coverage.branch_percent) + " branch");
  }
  if (coverage.lines_valid) facts.push(coverage.lines_valid.toLocaleString() + " statements");
  return facts;
}

function reportPercent(value) {
  return value.toFixed(0) + "%";
}

// Errors lead when there are any, because that is the number an operator acts on; otherwise
// the total carries it. The tool names come from the SARIF document, so this says "ruff" or
// "PMD" without either name appearing anywhere in Kiln.
function lintFact(lint) {
  const label = lint.tools.length ? " (" + lint.tools.join(", ") + ")" : "";
  const levels = [
    ["error", "lint error"],
    ["warning", "lint warning"],
    ["note", "lint note"],
  ];
  const counts = levels
    .filter(([level]) => lint[level])
    .map(([level, name]) => lint[level] + " " + name + (lint[level] === 1 ? "" : "s"));
  return (counts.length ? counts.join(" · ") : "0 lint") + label;
}

function healthAge(isoTimestamp) {
  const seconds = Math.round((Date.now() - new Date(isoTimestamp).getTime()) / 1000);
  if (!isFinite(seconds)) return "?";
  if (seconds < 0) return "just now";          // clock skew, same call as the server makes
  if (seconds < 60) return seconds + "s ago";
  if (seconds < 3600) return Math.round(seconds / 60) + "m ago";
  if (seconds < 86400) return Math.round(seconds / 3600) + "h ago";
  return Math.round(seconds / 86400) + "d ago";
}

function renderBoard(state) {
  const seqCb = $("sequential-toggle");
  if (seqCb) seqCb.checked = !!state.sequential;

  const humanRole = state.human_role || "human-in-the-loop";

  // Build pipeline stages dynamically from board lanes.
  // Special case: when human-in-the-loop + specifier both exist, split human into
  // Intake (human-initiated cards) and Review (specifier->human Gherkin approval).
  const hasSpecifier = state.board.lanes.includes("specifier");
  const roleIcon = { "intake": "📋", "specifier": "🔬", "review": "✅", "coder": "⚙️", "reviewer": "🔍", "architect": "🏗️", "game-coder": "⚙️", "game-refactorer": "🔧", "game-reviewer": "🔍", "game-architect": "🏗️", "done": "✅" };
  const roleLabel = { "intake": "Intake", "specifier": "Specifier", "review": "Review", "coder": "Coder", "reviewer": "Reviewer", "architect": "Architect", "game-coder": "Game Coder", "game-refactorer": "Game Refactorer", "game-reviewer": "Game Reviewer", "game-architect": "Game Architect", "done": "Done" };

  const pipeline = [];
  for (const lane of state.board.lanes) {
    if (lane === humanRole && hasSpecifier) {
      // Split human lane: Intake first (human sends to specifier),
      // then continue adding other lanes, and Review comes after Specifier.
      pipeline.push({
        id: "intake",
        lane: humanRole,
        label: (roleIcon["intake"] || "") + " " + (roleLabel["intake"] || "Intake"),
        cardFilter: (c) => c.lane === humanRole && (c.kind === "backlog" || c.sender === humanRole),
      });
      // Review will be inserted after the specifier lane is encountered
    } else if (lane === "specifier" && hasSpecifier) {
      pipeline.push({
        id: lane,
        lane: lane,
        label: (roleIcon[lane] || "") + " " + (roleLabel[lane] || lane),
        cardFilter: (c) => c.lane === lane,
      });
      // Insert Review right after Specifier
      pipeline.push({
        id: "review",
        lane: humanRole,
        label: (roleIcon["review"] || "") + " " + (roleLabel["review"] || "Review"),
        cardFilter: (c) => c.lane === humanRole && c.sender === "specifier",
      });
    } else {
      const label = roleLabel[lane] || lane.replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
      pipeline.push({
        id: lane,
        lane: lane,
        label: (roleIcon[lane] || "") + " " + label,
        cardFilter: (c) => c.lane === lane,
      });
    }
  }

  const host = $("lanes");
  host.replaceChildren();
  if (!pipeline.length) { host.append(text("div", "No pipeline stages to display.", "empty")); return; }

  const pipelineEl = text("div", null, "pipeline");
  for (let i = 0; i < pipeline.length; i++) {
    const stage = pipeline[i];
    let stageCards = [];
    for (const lane of state.board.lanes) {
      for (const card of (state.board.cards[lane] || [])) {
        if (stage.cardFilter(card)) stageCards.push(card);
      }
    }
    stageCards.sort((a, b) => {
      const aReview = a.sender === "specifier" && a.target === humanRole;
      const bReview = b.sender === "specifier" && b.target === humanRole;
      if (aReview && !bReview) return -1;
      if (!aReview && bReview) return 1;
      return 0;
    });

    const stageEl = text("div", null, "pipeline-stage" + (stageCards.length ? " has-cards" : ""));
    const headerEl = text("div", null, "pipeline-header");
    headerEl.append(text("span", stage.label, "pipeline-label"));
    if (stageCards.length) headerEl.append(text("span", String(stageCards.length), "pipeline-count"));
    stageEl.append(headerEl);

    // Worktree info
    if (stage.id === "intake" || stage.id === "review") {
      const lr = state.roles.find((r) => r.role === humanRole);
      if (lr && lr.worktree) stageEl.append(text("div", "Worktree: " + lr.worktree, "pipeline-worktree"));
    } else if (stage.id !== "done") {
      const lr = state.roles.find((r) => r.role === stage.id);
      if (lr && lr.worktree) stageEl.append(text("div", "Worktree: " + lr.worktree, "pipeline-worktree"));
    }

    if (!stageCards.length) {
      stageEl.append(text("div", "—", "empty"));
    } else {
      const cardsEl = text("div", null, "pipeline-cards");
      for (const card of stageCards) {
        const isReview = card.sender === "specifier" && card.target === humanRole;
        const el = text("div", null, "card"
          + (card.failed ? " failed" : "")
          + (card.unnamed ? " unnamed" : "")
          + (card.status === "processing" ? " working" : "")
          + (stage.id === "done" ? " done" : "")
          + (isReview ? " review" : ""));
        if (card.work_item) el.append(text("div", card.work_item, "work-item-id"));
        el.append(text("div", card.title, "name"));
        el.append(text(
          "div",
          card.kind === "backlog" ? "backlog · " + (card.age || "")
            : card.sender + " → " + card.target + " · " + (card.age || "")
              + (card.duration ? " · cycle " + card.duration : ""),
          "meta",
        ));
        if (card.summary && card.summary !== card.title) el.append(text("div", card.summary, "summary"));
        el.onclick = () => card.kind === "backlog"
          ? openTaskEditor(card)
          : openDocument(card.message_id, card.failed, isReview);
        cardsEl.append(el);
      }
      stageEl.append(cardsEl);
    }
    pipelineEl.append(stageEl);

    if (i < pipeline.length - 1) {
      const arrow = text("div", null, "pipeline-arrow");
      arrow.textContent = "▶";
      pipelineEl.append(arrow);
    }
  }
  host.append(pipelineEl);
}

function renderQueue(state) {
  const table = $("queue");
  const oldLog = $("live-log");
  const wasPinned = !oldLog || oldLog.scrollHeight - oldLog.scrollTop - oldLog.clientHeight < 24;
  const oldScrollTop = oldLog ? oldLog.scrollTop : 0;
  table.replaceChildren();
  const head = table.insertRow();
  for (const label of ["Role", "Agent / model", "State", "Current work", "Waiting", "In state", "Cost", ""]) {
    head.append(text("th", label));
  }
  for (const role of state.roles) {
    const row = table.insertRow();
    row.className = "role-row";
    row.append(text("td", role.role));

    // Which backend runs this role, and on which model. The agent comes from the sessions
    // file; the model from the role's own status file, so it is the model the worker was
    // actually invoked with rather than whatever the profile happened to ask for.
    const agentCell = text("td", null, "agent-cell");
    agentCell.append(text("span", role.agent || "—", "agent agent-" + (role.agent || "unknown")));
    // `—` until the role reports for the first time; "(CLI default)" is a real, meaningful
    // answer for copilot/codex/grok/pi and is passed through as the scheduler wrote it.
    agentCell.append(text("span", role.model || "—", "model"));
    row.append(agentCell);

    const stateCell = text("td");
    stateCell.append(text("span", (role.state || "—") + (role.attempt ? " " + role.attempt : ""), "state " + (role.state || "")));
    row.append(stateCell);

    row.append(text("td", role.work_item || "—"));
    row.append(text(
      "td", role.queue ? role.queue + (role.wait ? " · " + role.wait : "") : "—", "num",
    ));
    const since = text("td", (role.stalled ? "⚠ " : "") + (role.since_ago || "—"));
    if (role.stalled) since.className = "stall";
    row.append(since);
    row.append(text("td", money(role.cost_usd), "num"));

    // The direct path for "restart the specifier with CAT-3": prefill the composer with
    // this role and whatever it is currently holding.
    const action = text("td");
    const send = text("button", "Send", "row-send");
    send.title = "Send a message to " + role.role;
    send.onclick = () => {
      revealComposer(role.role, role.work_item || ITEM_PENDING);
    };
    action.append(send);
    row.append(action);
    row.onclick = (event) => {
      if (event.target.closest("button")) return;
      if (expandedRole === role.role) expandedRole = null;
      else {
        expandedRole = role.role;
        logStream = "scheduler";
        logOffsets.scheduler = logOffsets.worker = 0;
        logText.scheduler = logText.worker = "";
      }
      renderQueue(state);
      if (expandedRole && !$("role-dialog").open) $("role-dialog").showModal();
      pollLog();
    };
  }
  const selected = state.roles.find((role) => role.role === expandedRole);
  if (selected) renderRoleDetails(selected, state, wasPinned, oldScrollTop);
}

function renderRoleDetails(role, state, wasPinned, oldScrollTop) {
  $("role-title").textContent = role.display_name || role.role;
  const metrics = $("role-metrics");
  metrics.replaceChildren();
  const usage = role.token_usage || {};
  const details = [
    ["Worktree", role.worktree || "unknown"],
    ["Cycles", count(role.cycles)],
    ["Tokens", count(role.tokens)],
    ["Input", count(usage.input)],
    ["Output", count(usage.output)],
    ["Cache read", count(usage.cache_read)],
    ["Cache share", ratioPercent(role.cache_share)],
    ["Worker timeout", role.worker_timeout_sec ? role.worker_timeout_sec + "s" : "—"],
  ];
  for (const [label, value] of details) {
    const item = text("span");
    item.append(text("b", label + ": "));
    item.append(document.createTextNode(value));
    metrics.append(item);
  }
  const toolbar = $("role-log-toolbar");
  toolbar.replaceChildren();
  for (const stream of ["scheduler", "worker"]) {
    const button = text("button", stream, stream === logStream ? "active" : "");
    button.onclick = () => { logStream = stream; renderRoleDetails(role, state, true, 0); pollLog(); };
    toolbar.append(button);
  }
  toolbar.append(text("span", null, "spacer"));
  toolbar.append(copyButton("live-log"));
  const output = $("live-log");
  output.textContent = logText[logStream] || "No " + logStream + " log for this role.";
  output.scrollTop = wasPinned ? output.scrollHeight : oldScrollTop;
}

async function pollLog() {
  if (!expandedRole || !$("live-log")) return;
  const stream = logStream;
  const response = await fetch(
    "/api/logs/" + encodeURIComponent(expandedRole) + "?stream=" + stream +
      "&after=" + logOffsets[stream],
    { headers: { "X-Kiln-Cockpit": "1" } },
  );
  if (!response.ok) return;
  const payload = await response.json();
  if (payload.truncated) logText[stream] = "";
  if (payload.lines.length) logText[stream] += payload.lines.join("\n") + "\n";
  logOffsets[stream] = payload.offset;
  if (stream !== logStream || expandedRole !== payload.role) return;
  const output = $("live-log");
  if (!output) return;
  const pinned = output.scrollHeight - output.scrollTop - output.clientHeight < 24;
  output.textContent = logText[stream] || "No " + stream + " log for this role.";
  if (pinned) output.scrollTop = output.scrollHeight;
}

function renderActivity(state) {
  const table = $("activity");
  table.replaceChildren();
  const head = table.insertRow();
  for (const label of ["When", "From", "To", "Status", "Summary"]) head.append(text("th", label));
  for (const entry of state.activity) {
    const row = table.insertRow();
    row.append(text("td", entry.age || ""));
    row.append(text("td", entry.sender));
    row.append(text("td", entry.target));
    row.append(text("td", entry.status));
    const summary = text("td", (entry.escalation ? "⚠ " : "") + entry.summary);
    summary.style.cursor = "pointer";
    summary.onclick = () => openDocument(entry.message_id, false);
    row.append(summary);
  }
}

// --- theme -------------------------------------------------------------------------
// The inline script in <body> already applied the stored choice; this only wires the
// control and keeps the pressed state honest.
const THEMES = ["dark", "light", "neon"];
const THEME_KEY = "kiln-cockpit-theme";

function applyTheme(name) {
  if (!THEMES.includes(name)) name = "dark";
  // "dark" is the base `:root` palette, so it is expressed by removing the attribute
  // rather than by a `[data-theme="dark"]` block that would duplicate every token.
  if (name === "dark") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = name;
  for (const button of $("themes").querySelectorAll("button")) {
    button.setAttribute("aria-pressed", String(button.dataset.themeChoice === name));
  }
  try { localStorage.setItem(THEME_KEY, name); } catch (error) { /* preference is optional */ }
}

$("themes").onclick = (event) => {
  const choice = event.target.dataset && event.target.dataset.themeChoice;
  if (choice) applyTheme(choice);
};

applyTheme(document.documentElement.dataset.theme || "dark");

async function poll() {
  try {
    const response = await fetch("/api/state", { headers: { "X-Kiln-Cockpit": "1" } });
    if (!response.ok) throw new Error(response.statusText);
    latest = await response.json();
    $("dot").className = "dot";
    $("updated").textContent = "updated " + latest.generated_at.slice(11);
    renderHeader(latest);
    renderAttention(latest);
    renderBoard(latest);
    renderQueue(latest);
    renderActivity(latest);
    renderSend(latest);
    // Sequential toggle click handler
    const seqCb = $("sequential-toggle");
    seqCb.onchange = async () => {
      const enabled = seqCb.checked;
      try {
        const result = await post("/api/sequential", { enabled });
        latest.sequential = result.sequential;
        seqCb.checked = result.sequential;
        toast(result.sequential ? "Batch mode on: tasks auto-dispatch on cycle end" : "Batch mode off");
      } catch (err) {
        seqCb.checked = !enabled;
        toast("Toggle failed: " + err.message, true);
      }
    };
    pollTestMetrics();
    pollLog();
  } catch (error) {
    // A failed poll marks the page stale rather than blanking it: the last known state is
    // more useful than an empty screen, and the swarm itself is unaffected either way.
    $("dot").className = "dot stale";
    $("updated").textContent = "no answer from the cockpit";
  }
}

// Its own request on the same tick, so an unreadable report degrades this panel alone. A
// failure here leaves the last known health on screen rather than blanking it, matching how
// poll() treats a failed state fetch.
async function pollTestMetrics() {
  try {
    const response = await fetch("/api/test-metrics", { headers: { "X-Kiln-Cockpit": "1" } });
    if (!response.ok) throw new Error(response.statusText);
    renderTestMetrics(await response.json());
  } catch (error) {
    /* keep the previous reading */
  }
}

async function openDocument(messageId, retryable, gherkinReview) {
  const response = await fetch("/api/messages/" + messageId, { headers: { "X-Kiln-Cockpit": "1" } });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) return toast(payload.error || "could not read that message", true);
  $("doc-title").textContent = payload.sender + " → " + payload.target + " · " + (payload.work_item || "unnamed");
  $("doc-body").textContent = (payload.error ? "ERROR: " + payload.error + "\n\n" : "") + payload.content;
  $("doc-retry").style.display = retryable ? "" : "none";
  $("doc-guidance").style.display = retryable ? "" : "none";
  $("doc-retry").onclick = () => {
    retryMessage(messageId, $("doc-guidance").value);
    $("doc-dialog").close();
  };
  // Gherkin review: show approve/reject buttons in the dialog instead of the attention rail
  const reviewButtons = $("doc-review-buttons");
  if (gherkinReview) {
    reviewButtons.style.display = "";
    $("doc-approve").onclick = () => { approveGherkin(messageId); $("doc-dialog").close(); };
    $("doc-reject").onclick = () => {
      $("doc-dialog").close();
      // Small delay so the dialog closes before the prompt appears
      setTimeout(() => rejectGherkin(messageId), 100);
    };
  } else {
    reviewButtons.style.display = "none";
  }
  $("doc-dialog").showModal();
}

async function retryMessage(messageId, guidance) {
  try {
    const result = await post("/api/retry/" + messageId, { guidance: guidance || "" });
    toast("sent back to " + result.target);
    poll();
  } catch (error) { toast(error.message, true); }
}

async function acknowledgeMessage(messageId) {
  try {
    await post("/api/ack/" + messageId, {});
    toast("acknowledged");
    poll();
  } catch (error) { toast(error.message, true); }
}

async function approveGherkin(messageId) {
  try {
    const result = await post("/api/gherkin-approve/" + messageId, {});
    toast("Gherkin approved — forwarded to " + result.target);
    poll();
  } catch (error) { toast(error.message, true); }
}

async function rejectGherkin(messageId) {
  const notes = prompt("Revision notes for the specifier (what needs to change):");
  if (notes === null) return; // cancelled
  try {
    const result = await post("/api/gherkin-reject/" + messageId, { notes: notes || "" });
    toast("Gherkin rejected — sent back to " + result.target + " with notes");
    poll();
  } catch (error) { toast(error.message, true); }
}

function populateTaskTargets(selected) {
  const target = $("task-target");
  target.replaceChildren(...(latest ? latest.roles : []).map((role) => option(role.role, role.role)));
  target.value = selected || (latest && latest.intake_role) || "";
  if (!target.value && target.options.length) target.selectedIndex = 0;
}

function openTaskEditor(card) {
  editingTask = card || null;
  const editing = Boolean(card);
  $("task-dialog-title").textContent = editing ? "Edit " + card.work_item : "New backlog task";
  $("task-work-item").value = editing ? card.work_item : "";
  $("task-work-item").disabled = editing;
  $("task-title").value = editing ? card.title : "";
  $("task-body").value = editing ? card.body : "";
  $("task-save").textContent = editing ? "Save" : "Create";
  $("task-handoff").style.display = editing ? "" : "none";
  $("task-target").style.display = editing ? "" : "none";
  $("task-archive").style.display = editing ? "" : "none";
  populateTaskTargets(latest && latest.intake_role);
  $("task-dialog").showModal();
  $(editing ? "task-title" : "task-work-item").focus();
}

$("new-task").onclick = () => openTaskEditor(null);

$("task-save").onclick = async () => {
  try {
    const payload = {
      work_item: $("task-work-item").value,
      title: $("task-title").value,
      body: $("task-body").value,
    };
    const path = editingTask
      ? "/api/tasks/" + encodeURIComponent(editingTask.task_id)
      : "/api/tasks";
    await post(path, payload);
    $("task-dialog").close();
    toast(editingTask ? "backlog task updated" : "backlog task created");
    poll();
  } catch (error) { toast(error.message, true); }
};

$("task-handoff").onclick = async () => {
  if (!editingTask) return;
  try {
    const result = await post(
      "/api/tasks/" + encodeURIComponent(editingTask.task_id) + "/handoff",
      { target: $("task-target").value },
    );
    $("task-dialog").close();
    toast("handed " + editingTask.work_item + " to " + result.target);
    poll();
  } catch (error) { toast(error.message, true); }
};

$("task-archive").onclick = async () => {
  if (!editingTask || !confirm("Archive " + editingTask.work_item + "?")) return;
  try {
    await post("/api/tasks/" + encodeURIComponent(editingTask.task_id) + "/archive", {});
    $("task-dialog").close();
    toast("backlog task archived");
    poll();
  } catch (error) { toast(error.message, true); }
};

$("task-close").onclick = () => $("task-dialog").close();

$("send-item").onchange = () => {
  const other = $("send-item").value === ITEM_OTHER;
  $("send-item-other").style.display = other ? "" : "none";
  if (other) $("send-item-other").focus();
};
$("send-target").onchange = () => renderSendWarning();

$("send-go").onclick = async () => {
  const chosen = $("send-item").value;
  try {
    const result = await post("/api/send", {
      target: $("send-target").value,
      summary: $("send-text").value,
      // `pending` is a real answer meaning "let the specifier name it", so it is sent as
      // itself rather than as an empty field.
      work_item: chosen === ITEM_OTHER ? $("send-item-other").value : chosen,
    });
    $("send-text").value = "";
    $("send-item-other").value = "";
    toast("queued for " + result.target);
    poll();
  } catch (error) { toast(error.message, true); }
};

$("teardown").onclick = async () => {
  // Typed confirmation, matching what the endpoint itself demands: this stops every Kiln
  // process on the machine, agent panes included.
  if (prompt("This stops every Kiln process on this machine. Type TEARDOWN to confirm.") !== "TEARDOWN") return;
  try {
    await post("/api/teardown", { confirm: "TEARDOWN" });
    toast("stopping the swarm…");
  } catch (error) { toast(error.message, true); }
};

$("doc-close").onclick = () => $("doc-dialog").close();
$("doc-copy").onclick = () => copyAll("doc-body");
$("role-close").onclick = () => $("role-dialog").close();
$("role-dialog").onclose = () => { expandedRole = null; };

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
